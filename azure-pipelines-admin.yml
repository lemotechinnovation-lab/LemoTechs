# LemoTech Admin Dashboard Deployment Pipeline
# Secure admin interface with role-based access controls

trigger:
  branches:
    include:
    - master
    - develop
  paths:
    include:
    - admin-dashboard/*
    - templates/*

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  adminPath: 'admin-dashboard'
  environmentName: 'production'
  applicationName: 'admin-dashboard'

stages:
- stage: BuildAdminDashboard
  displayName: 'Build Admin Dashboard'
  jobs:
  - job: BuildAdminApp
    displayName: 'Build LemoTech Admin Dashboard'
    steps:
    - checkout: self
      displayName: 'Checkout Source Code'
    
    - template: templates/environment-config.yml
      parameters:
        environmentName: $(environmentName)
        applicationName: $(applicationName)
    
    - template: templates/react-build.yml
      parameters:
        nodeVersion: $(nodeVersion)
        workingDirectory: $(adminPath)
        environmentName: $(environmentName)
        apiBaseUrl: $(API_BASE_URL)
        customBuildCommand: 'npm run build'

- stage: DeployAdminDashboard
  displayName: 'Deploy Admin Dashboard'
  dependsOn: BuildAdminDashboard
  condition: succeeded()
  jobs:
  - deployment: DeployAdminToAzure
    displayName: 'Deploy Admin Dashboard to Azure'
    environment: 'Admin-Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'production-build'
            displayName: 'Download Build Artifacts'
          
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/production-build/production-build.zip'
              destinationFolder: '$(Pipeline.Workspace)/admin-dist'
              cleanDestinationFolder: true
            displayName: 'Extract Build Files'
          
          - script: |
              echo "=== Admin Dashboard Security Configuration ==="
              echo "Adding security headers and access controls..."
              
              # Create security configuration file
              cat > $(Pipeline.Workspace)/admin-dist/staticwebapp.config.json << EOF
              {
                "routes": [
                  {
                    "route": "/admin/*",
                    "allowedRoles": ["admin", "manager"]
                  },
                  {
                    "route": "/api/*",
                    "allowedRoles": ["admin", "manager"]
                  },
                  {
                    "route": "/*",
                    "serve": "/index.html",
                    "statusCode": 200,
                    "allowedRoles": ["admin", "manager"]
                  }
                ],
                "responseOverrides": {
                  "401": {
                    "redirect": "/login",
                    "statusCode": 302
                  }
                },
                "globalHeaders": {
                  "X-Frame-Options": "DENY",
                  "X-Content-Type-Options": "nosniff",
                  "X-XSS-Protection": "1; mode=block",
                  "Strict-Transport-Security": "max-age=31536000; includeSubDomains",
                  "Content-Security-Policy": "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'"
                }
              }
              EOF
              
              echo "Security configuration created:"
              cat $(Pipeline.Workspace)/admin-dist/staticwebapp.config.json
              
              echo "✅ Admin dashboard security configuration completed!"
            displayName: 'Configure Admin Security'
          
          - template: templates/azure-static-deploy.yml
            parameters:
              staticWebAppToken: '$(AZURE_ADMIN_STATIC_WEB_APPS_API_TOKEN)'
              appLocation: '$(Pipeline.Workspace)/admin-dist'
              outputLocation: '.'
              environmentName: $(environmentName)
              customDomain: 'admin.lemotech.co.za'  # Update with your actual admin domain
              skipAppBuild: true
          
          - script: |
              echo "=== Post-Deploy Admin Security Verification ==="
              
              # Verify security headers are properly configured
              ADMIN_URL="https://admin.lemotech.co.za"  # Update with actual URL
              
              echo "Waiting for deployment to complete..."
              sleep 45
              
              echo "Testing security headers..."
              HEADERS=$(curl -I -s "$ADMIN_URL" || echo "Connection failed")
              
              if echo "$HEADERS" | grep -i "X-Frame-Options"; then
                echo "✅ X-Frame-Options header found"
              else
                echo "⚠️ X-Frame-Options header missing"
              fi
              
              if echo "$HEADERS" | grep -i "Content-Security-Policy"; then
                echo "✅ Content-Security-Policy header found"
              else
                echo "⚠️ Content-Security-Policy header missing"
              fi
              
              if echo "$HEADERS" | grep -i "Strict-Transport-Security"; then
                echo "✅ HSTS header found"
              else
                echo "⚠️ HSTS header missing"
              fi
              
              echo "=== Admin Dashboard Deployment Summary ==="
              echo "🔐 Admin Dashboard URL: $ADMIN_URL"
              echo "🛡️ Security headers configured"
              echo "👥 Role-based access: admin, manager"
              echo "🔒 Authentication required for all routes"
              echo "✅ Admin dashboard deployment completed!"
            displayName: 'Verify Admin Security'
            condition: always()

# LemoTech Backend Deployment Pipeline
# Comprehensive deployment pipeline for backend API with health checks
# Supports: Build, Deploy, Test, and Monitoring

trigger:
- master
- main

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  
  # Azure connection and resources (updated based on current setup)
  azureServiceConnection: 'LemoTech-Azure-Connection'
  resourceGroupName: 'lemotech-platform'
  backendAppName: 'lemotech-api-backend'
  
  # Deployment settings
  packageName: 'lemotech-backend'
  healthCheckTimeout: 300

stages:
- stage: Build
  displayName: 'Build Backend'
  jobs:
  - job: BuildBackend
    displayName: 'Build LemoTech Backend API'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo === LemoTech Backend Build Process ===
        cd backend
        echo Current directory: %CD%
        node --version
        npm --version
        
        echo Installing dependencies...
        npm install --legacy-peer-deps
        
        echo Running TypeScript build...
        npm run build
        
        echo Verifying build output...
        if exist "dist" (
          echo ✅ Build successful - dist directory created
          dir dist
        ) else (
          echo ❌ Build failed - dist directory not found
          exit 1
        )
        
        echo Build completed successfully!
      displayName: 'Install Dependencies and Build'
    
    - script: |
        echo === Creating Deployment Package ===
        cd backend
        echo Excluding node_modules, logs, and temp files...
        echo Package contents:
        dir /s /b | findstr /v node_modules | findstr /v "\.log" | more
        echo ... (showing sample files)
      displayName: 'Pre-Archive Verification'
    
    - script: |
        echo === Creating Oryx-compatible package ===
        mkdir deploy-package
        cd backend
        
        echo Copying and updating package.json...
        copy package.json ..\deploy-package\
        
        echo Creating clean package.json for deployment...
        cd ..\deploy-package
        powershell -Command "$original = Get-Content package.json | ConvertFrom-Json; $clean = @{ name = $original.name; version = $original.version; main = 'dist/app.js'; scripts = @{ start = 'node dist/app.js' }; engines = $original.engines; dependencies = $original.dependencies }; $clean | ConvertTo-Json -Depth 10 | Set-Content package.json"
        
        echo Verifying package.json...
        type package.json
        
        echo Installing production dependencies...
        npm install --production --legacy-peer-deps
        
        echo Copying built dist files...
        cd ..\backend
        xcopy /E /I dist ..\deploy-package\dist
        
        echo Copying essential files...
        if exist web.config copy web.config ..\deploy-package\
        if exist .deployment copy .deployment ..\deploy-package\
        
        echo Package structure:
        cd ..\deploy-package
        dir
      displayName: 'Prepare Oryx-compatible Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-package'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(packageName)-$(Build.BuildId).zip'
        replaceExistingArchive: true
        verbose: true
      displayName: 'Create Deployment Package'
    
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(packageName)-$(Build.BuildId).zip'
        ArtifactName: 'backend-drop'
        publishLocation: 'Container'
      displayName: 'Publish Backend Artifact'
    
    - script: |
        echo === Build Stage Summary ===
        echo ✅ Node.js $(nodeVersion) installed
        echo ✅ Dependencies installed with --legacy-peer-deps
        echo ✅ TypeScript build completed
        echo ✅ Deployment package created: $(packageName)-$(Build.BuildId).zip
        echo ✅ Artifact published for deployment
      displayName: 'Build Summary'
    
    - script: |
        echo === Cleanup ===
        if exist deploy-package rmdir /s /q deploy-package
        echo Temporary package directory cleaned up
      displayName: 'Cleanup Build Artifacts'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployBackend
    displayName: 'Deploy LemoTech Backend'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'backend-drop'
              downloadPath: '$(Pipeline.Workspace)'
            displayName: 'Download Backend Artifact'
          
          - script: |
              echo === Pre-Deployment Verification ===
              echo Artifact location: $(Pipeline.Workspace)\backend-drop\
              dir "$(Pipeline.Workspace)\backend-drop\"
              echo Package to deploy: $(packageName)-$(Build.BuildId).zip
            displayName: 'Pre-Deployment Check'
          
          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webAppLinux'
              appName: $(backendAppName)
              resourceGroupName: $(resourceGroupName)
              package: '$(Pipeline.Workspace)/backend-drop/$(packageName)-$(Build.BuildId).zip'
              runtimeStack: 'NODE|20-lts'
              startUpCommand: 'node dist/app.js'
              deploymentMethod: 'zipDeploy'
              appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -ENABLE_ORYX_BUILD false'
            displayName: 'Deploy to Azure App Service'
          
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== Configuring App Service Environment ==="
                
                # Set essential environment variables and disable build
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(backendAppName) \
                  --settings \
                    NODE_ENV="production" \
                    PORT="8000" \
                    DATABASE_URL="postgresql://lemotech_admin:SecureDB2024!Platform@lemotech-db-server.postgres.database.azure.com:5432/lemotech_innovations?sslmode=require" \
                    JWT_SECRET="LemoTech2024!SecureJWT!Production!Key!9x8v7c6b5n4m3" \
                    CORS_ORIGIN="*" \
                    AUTO_MIGRATE="true" \
                    SEED_TEST_DATA="false" \
                    SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
                    ENABLE_ORYX_BUILD="false"
                
                echo "✅ Environment variables configured"
                
                # Verify Service Connector status
                echo "=== Verifying Service Connector ==="
                az webapp connection list \
                  --resource-group $(resourceGroupName) \
                  --name $(backendAppName) \
                  --query "[].{Name:name, Status:provisioningState, Target:targetService.id}" \
                  --output table
                
                echo "✅ Service connector verification completed"
                
                # Restart app to apply new configuration
                echo "=== Restarting App Service ==="
                az webapp restart \
                  --resource-group $(resourceGroupName) \
                  --name $(backendAppName)
                
                echo "✅ App service restarted"
            displayName: 'Configure Environment & Verify Service Connector'
          
          - script: |
              echo "=== Post-Deployment Health Check ==="
              echo "Waiting 45 seconds for service startup and configuration..."
              sleep 45
              
              echo "Testing backend health..."
              APP_URL="https://$(backendAppName).azurewebsites.net"
              
              for i in {1..12}; do
                echo "Health check attempt $i/12..."
                
                # Test basic connectivity
                if curl -f -s -o /dev/null -w "%{http_code}" "$APP_URL" | grep -q "200"; then
                  echo "✅ Backend is responding with HTTP 200!"
                  
                  # Test specific endpoints if available
                  echo "Testing API endpoints..."
                  if curl -f -s -o /dev/null "$APP_URL/health" 2>/dev/null; then
                    echo "✅ Health endpoint responding"
                  fi
                  
                  if curl -f -s -o /dev/null "$APP_URL/api-docs" 2>/dev/null; then
                    echo "✅ API docs endpoint responding"
                  fi
                  
                  break
                elif [ $i -eq 12 ]; then
                  echo "⚠️ Backend may still be starting up or have configuration issues"
                  echo "Check logs at: https://$(backendAppName).scm.azurewebsites.net/api/logs/docker"
                else
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" 2>/dev/null || echo "000")
                  echo "HTTP Status: $HTTP_CODE - Still starting up, waiting 15 seconds..."
                  sleep 15
                fi
              done
            displayName: 'Enhanced Health Check'
          
          - script: |
              echo === Deployment Completed Successfully ===
              echo.
              echo 🌐 Backend API: https://$(backendAppName).azurewebsites.net
              echo 📚 API Documentation: https://$(backendAppName).azurewebsites.net/api-docs
              echo 🔍 Health Check: https://$(backendAppName).azurewebsites.net/health
              echo ⚙️ Kudu Console: https://$(backendAppName).scm.azurewebsites.net
              echo 📋 Deployment Logs: https://$(backendAppName).scm.azurewebsites.net/api/deployments
              echo 📊 App Insights: https://portal.azure.com/#@/resource/subscriptions/9aeef90e-7413-4841-bc9b-a4e7410709a4/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(backendAppName)/appInsights
              echo.
              echo 🔗 Service Connections:
              echo   PostgreSQL: lemotech-db-server.postgres.database.azure.com
              echo   Database: lemotech_innovations
              echo   SSL: Enabled
              echo.
              echo ⚙️ Configuration:
              echo   Node.js: 20-lts
              echo   Runtime: Linux
              echo   Service Connection: $(azureServiceConnection)
              echo   Resource Group: $(resourceGroupName)
              echo.
              echo ✅ Backend deployment completed successfully!
            displayName: 'Deployment Summary'

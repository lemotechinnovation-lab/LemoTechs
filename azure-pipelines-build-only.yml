# LemoTech Build-Only Pipeline for Classic Releases
# This pipeline only builds artifacts, releases are handled by classic release pipelines

trigger:
  branches:
    include:
    - master
    - main
    - develop
    - release/*
  paths:
    exclude:
    - docs/*
    - README.md
    - "*.md"

pr: none

pool:
  name: 'Default'

variables:
  - group: LemoTech-Production-Variables
  - name: nodeVersion
    value: '20.x'
  - name: NPM_CONFIG_PRODUCTION
    value: false

stages:
- stage: BuildArtifacts
  displayName: 'Build All Components'
  jobs:
  - job: BuildBackend
    displayName: 'Build Backend API'
    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Building Backend API ==="
        cd backend
        npm install --legacy-peer-deps --unsafe-perm
        npm run build
        
        # Verify build
        if [ -f "dist/app.js" ]; then
          echo "✅ Backend build successful"
        else
          echo "❌ Backend build failed"
          exit 1
        fi
      displayName: 'Build Backend'
    
    - script: |
        echo "=== Preparing Backend Deployment Package ==="
        cd backend
        mkdir -p ../artifacts/backend
        
        # Copy dist files
        cp -r dist/* ../artifacts/backend/
        
        # Create production package.json
        cat > ../artifacts/backend/package.json << 'EOF'
        {
          "name": "lemotech-backend",
          "version": "1.0.0",
          "main": "app.js",
          "scripts": {
            "start": "node app.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF
        
        # Copy dependencies
        node -e "
          const fs = require('fs');
          const backendPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const deployPkg = JSON.parse(fs.readFileSync('../artifacts/backend/package.json', 'utf8'));
          deployPkg.dependencies = backendPkg.dependencies;
          fs.writeFileSync('../artifacts/backend/package.json', JSON.stringify(deployPkg, null, 2));
        "
        
        # Copy essential files
        cp migrate.json ../artifacts/backend/ || echo "No migrate.json found"
        cp -r scripts ../artifacts/backend/ || echo "No scripts found"
        
        echo "✅ Backend artifact prepared"
      displayName: 'Prepare Backend Artifact'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'artifacts/backend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
        replaceExistingArchive: true
      displayName: 'Archive Backend Files'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
        artifactName: 'backend'
        publishLocation: 'Container'
      displayName: 'Publish Backend Artifact'

  - job: BuildFrontend
    displayName: 'Build Frontend App'
    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Building Frontend App ==="
        cd frontend
        
        # Create production environment
        cat > .env << EOF
        VITE_API_BASE_URL=https://api.lemotechinnovations.co.za
        VITE_ENVIRONMENT=production
        VITE_APP_TITLE=LemoTech - On-Demand Cleaning
        EOF
        
        npm install --legacy-peer-deps --unsafe-perm
        npm run build
        
        # Verify build
        if [ -f "dist/index.html" ]; then
          echo "✅ Frontend build successful"
        else
          echo "❌ Frontend build failed"
          exit 1
        fi
      displayName: 'Build Frontend'
    
    - script: |
        echo "=== Preparing Frontend Deployment Package ==="
        cd frontend
        mkdir -p ../artifacts/frontend
        
        # Copy all dist files
        cp -r dist/* ../artifacts/frontend/
        
        # Copy public files that might not be in dist
        cp public/manifest.json ../artifacts/frontend/ 2>/dev/null || echo "No manifest.json"
        cp public/sw.js ../artifacts/frontend/ 2>/dev/null || echo "No service worker"
        cp -r public/icons ../artifacts/frontend/ 2>/dev/null || echo "No icons directory"
        
        # Create SPA server
        cat > ../artifacts/frontend/server.js << 'EOF'
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        const port = process.env.PORT || 8080;
        const root = path.resolve(__dirname);
        
        const mimeTypes = {
          '.html': 'text/html',
          '.js': 'application/javascript',
          '.css': 'text/css',
          '.json': 'application/json',
          '.png': 'image/png',
          '.jpg': 'image/jpeg',
          '.svg': 'image/svg+xml',
          '.ico': 'image/x-icon'
        };
        
        const server = http.createServer((req, res) => {
          let reqPath = decodeURI(req.url.split('?')[0]);
          if (reqPath === '/') reqPath = '/index.html';
          
          const filePath = path.join(root, reqPath);
          
          fs.stat(filePath, (err, stats) => {
            if (err || !stats.isFile()) {
              // SPA fallback
              const indexPath = path.join(root, 'index.html');
              fs.readFile(indexPath, (err, data) => {
                if (err) {
                  res.writeHead(404);
                  res.end('Not Found');
                  return;
                }
                res.writeHead(200, {'Content-Type': 'text/html'});
                res.end(data);
              });
            } else {
              fs.readFile(filePath, (err, data) => {
                if (err) {
                  res.writeHead(500);
                  res.end('Server Error');
                  return;
                }
                const ext = path.extname(filePath);
                const contentType = mimeTypes[ext] || 'application/octet-stream';
                res.writeHead(200, {'Content-Type': contentType});
                res.end(data);
              });
            }
          });
        });
        
        server.listen(port, () => {
          console.log('Frontend server listening on port', port);
        });
        EOF
        
        # Create package.json for server
        cat > ../artifacts/frontend/package.json << 'EOF'
        {
          "name": "lemotech-frontend",
          "version": "1.0.0",
          "main": "server.js",
          "scripts": {
            "start": "node server.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF
        
        echo "✅ Frontend artifact prepared"
      displayName: 'Prepare Frontend Artifact'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'artifacts/frontend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        replaceExistingArchive: true
      displayName: 'Archive Frontend Files'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        artifactName: 'frontend'
        publishLocation: 'Container'
      displayName: 'Publish Frontend Artifact'

  - job: BuildAdmin
    displayName: 'Build Admin Dashboard'
    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Building Admin Dashboard ==="
        cd admin-dashboard
        
        # Create production environment
        cat > .env << EOF
        VITE_API_BASE_URL=https://api.lemotechinnovations.co.za
        VITE_ENVIRONMENT=production
        VITE_APP_TITLE=LemoTech Admin Dashboard
        VITE_REQUIRE_AUTH=true
        EOF
        
        npm install --legacy-peer-deps --unsafe-perm
        npm run build
        
        # Verify build
        if [ -f "dist/index.html" ]; then
          echo "✅ Admin build successful"
        else
          echo "❌ Admin build failed"
          exit 1
        fi
      displayName: 'Build Admin Dashboard'
    
    - script: |
        echo "=== Preparing Admin Deployment Package ==="
        cd admin-dashboard
        mkdir -p ../artifacts/admin
        
        # Copy all dist files
        cp -r dist/* ../artifacts/admin/
        
        # Copy public files
        cp public/lemotech-logo.png ../artifacts/admin/ 2>/dev/null || echo "No logo"
        cp public/vite.svg ../artifacts/admin/ 2>/dev/null || echo "No vite.svg"
        
        # Create SPA server with security headers
        cat > ../artifacts/admin/server.js << 'EOF'
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        const port = process.env.PORT || 8080;
        const root = path.resolve(__dirname);
        
        const mimeTypes = {
          '.html': 'text/html',
          '.js': 'application/javascript',
          '.css': 'text/css',
          '.json': 'application/json',
          '.png': 'image/png',
          '.jpg': 'image/jpeg',
          '.svg': 'image/svg+xml',
          '.ico': 'image/x-icon'
        };
        
        const server = http.createServer((req, res) => {
          let reqPath = decodeURI(req.url.split('?')[0]);
          if (reqPath === '/') reqPath = '/index.html';
          
          const filePath = path.join(root, reqPath);
          
          fs.stat(filePath, (err, stats) => {
            if (err || !stats.isFile()) {
              // SPA fallback
              const indexPath = path.join(root, 'index.html');
              fs.readFile(indexPath, (err, data) => {
                if (err) {
                  res.writeHead(404);
                  res.end('Not Found');
                  return;
                }
                const headers = {
                  'Content-Type': 'text/html',
                  'X-Frame-Options': 'DENY',
                  'X-Content-Type-Options': 'nosniff',
                  'Strict-Transport-Security': 'max-age=31536000',
                  'X-XSS-Protection': '1; mode=block'
                };
                res.writeHead(200, headers);
                res.end(data);
              });
            } else {
              fs.readFile(filePath, (err, data) => {
                if (err) {
                  res.writeHead(500);
                  res.end('Server Error');
                  return;
                }
                const ext = path.extname(filePath);
                const contentType = mimeTypes[ext] || 'application/octet-stream';
                const headers = {
                  'Content-Type': contentType,
                  'X-Frame-Options': 'DENY',
                  'X-Content-Type-Options': 'nosniff'
                };
                res.writeHead(200, headers);
                res.end(data);
              });
            }
          });
        });
        
        server.listen(port, () => {
          console.log('Admin Dashboard server listening on port', port);
        });
        EOF
        
        # Create package.json for server
        cat > ../artifacts/admin/package.json << 'EOF'
        {
          "name": "lemotech-admin",
          "version": "1.0.0",
          "main": "server.js",
          "scripts": {
            "start": "node server.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF
        
        echo "✅ Admin artifact prepared"
      displayName: 'Prepare Admin Artifact'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'artifacts/admin'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/admin.zip'
        replaceExistingArchive: true
      displayName: 'Archive Admin Files'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/admin.zip'
        artifactName: 'admin'
        publishLocation: 'Container'
      displayName: 'Publish Admin Artifact'

- stage: PublishSummary
  displayName: 'Build Summary'
  dependsOn: BuildArtifacts
  jobs:
  - job: Summary
    displayName: 'Build Summary'
    steps:
    - script: |
        echo "=== 🚀 LemoTech Build Complete! ==="
        echo ""
        echo "✅ Backend API - Ready for deployment"
        echo "✅ Frontend App - Ready for deployment" 
        echo "✅ Admin Dashboard - Ready for deployment"
        echo ""
        echo "📦 Artifacts published for classic release pipeline consumption"
        echo "🎯 Ready for release management via Azure DevOps Releases"
      displayName: 'Display Build Summary'

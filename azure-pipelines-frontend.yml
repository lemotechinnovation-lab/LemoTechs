# LemoTech Frontend Deployment Pipeline
# Comprehensive React frontend deployment with environment management

trigger:
  branches:
    include:
    - master
    - develop
  paths:
    include:
    - frontend/*
    - templates/*

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  frontendPath: 'frontend'
  environmentName: 'production'
  applicationName: 'frontend'

stages:
- stage: BuildFrontend
  displayName: 'Build Frontend Application'
  jobs:
  - job: BuildReactApp
    displayName: 'Build LemoTech Frontend'
    steps:
    - checkout: self
      displayName: 'Checkout Source Code'
    
    - template: templates/environment-config.yml
      parameters:
        environmentName: $(environmentName)
        applicationName: $(applicationName)
    
    - template: templates/react-build.yml
      parameters:
        nodeVersion: $(nodeVersion)
        workingDirectory: $(frontendPath)
        environmentName: $(environmentName)
        apiBaseUrl: $(API_BASE_URL)
        customBuildCommand: 'npm run build'

- stage: DeployFrontend
  displayName: 'Deploy to Azure Static Web Apps'
  dependsOn: BuildFrontend
  condition: succeeded()
  jobs:
  - deployment: DeployToAzure
    displayName: 'Deploy Frontend to Azure'
    environment: 'Frontend-Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'production-build'
            displayName: 'Download Build Artifacts'
          
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/production-build/production-build.zip'
              destinationFolder: '$(Pipeline.Workspace)/frontend-dist'
              cleanDestinationFolder: true
            displayName: 'Extract Build Files'
          
          - template: templates/azure-static-deploy.yml
            parameters:
              staticWebAppToken: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
              appLocation: '$(Pipeline.Workspace)/frontend-dist'
              outputLocation: '.'
              environmentName: $(environmentName)
              customDomain: 'app.lemotech.co.za'  # Update with your actual domain
              skipAppBuild: true

# LemoTech Platform Orchestrator Pipeline
# Coordinates backend, frontend, and admin dashboard deployments in sequence

trigger:
  branches:
    include:
    - master
  paths:
    exclude:
    - docs/*
    - README.md
    - "*.md"

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  deploymentEnvironment: 'production'

stages:
# Stage 1: Backend API Deployment
- stage: DeployBackend
  displayName: 'Deploy Backend API'
  jobs:
  - job: TriggerBackendPipeline
    displayName: 'Trigger Backend Deployment'
    steps:
    - script: |
        echo "=== LemoTech Platform Deployment Orchestrator ==="
        echo "Starting sequential deployment process..."
        echo "Stage 1: Backend API Deployment"
        echo "Environment: $(deploymentEnvironment)"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      displayName: 'Initialize Orchestrator'
    
    - task: TriggerBuild@4
      inputs:
        definitionIsInCurrentTeamProject: true
        buildDefinition: 'azure-pipelines-backend'
        queueBuildForUserThatTriggeredBuild: true
        ignoreSslCertificateErrors: false
        useSameSourceVersion: true
        useCustomSourceVersion: false
        useSameBranch: true
        waitForQueuedBuildsToFinish: true
        storeInEnvironmentVariable: true
        authenticationMethod: 'OAuth Token'
        password: '$(System.AccessToken)'
        enableBuildInQueueCondition: false
        dependentOnSuccessfulBuildCondition: false
        dependentOnFailedBuildCondition: false
        checkbuildsoncurrentbranch: false
        failTaskIfBuildsNotSuccessful: true
      displayName: 'Deploy Backend API'
    
    - script: |
        echo "=== Backend Deployment Health Check ==="
        echo "Waiting for backend to be fully operational..."
        sleep 60
        
        BACKEND_URL="https://lemotech-api-backend.azurewebsites.net"
        
        for i in {1..10}; do
          echo "Backend health check attempt $i/10..."
          
          if curl -f -s -o /dev/null "$BACKEND_URL/health" 2>/dev/null; then
            echo "✅ Backend API is healthy and responding!"
            echo "🌐 Backend URL: $BACKEND_URL"
            break
          elif [ $i -eq 10 ]; then
            echo "❌ Backend health check failed after 10 attempts"
            echo "This will block frontend and admin deployments"
            exit 1
          else
            echo "Backend not ready, waiting 30 seconds..."
            sleep 30
          fi
        done
        
        echo "✅ Backend deployment verification completed!"
      displayName: 'Verify Backend Health'

# Stage 2: Frontend Deployment (depends on backend success)
- stage: DeployFrontend
  displayName: 'Deploy Frontend Application'
  dependsOn: DeployBackend
  condition: succeeded()
  jobs:
  - job: TriggerFrontendPipeline
    displayName: 'Trigger Frontend Deployment'
    steps:
    - script: |
        echo "=== Stage 2: Frontend Application Deployment ==="
        echo "Backend deployment successful, proceeding with frontend..."
      displayName: 'Initialize Frontend Deployment'
    
    - task: TriggerBuild@4
      inputs:
        definitionIsInCurrentTeamProject: true
        buildDefinition: 'azure-pipelines-frontend'
        queueBuildForUserThatTriggeredBuild: true
        ignoreSslCertificateErrors: false
        useSameSourceVersion: true
        useCustomSourceVersion: false
        useSameBranch: true
        waitForQueuedBuildsToFinish: true
        storeInEnvironmentVariable: true
        authenticationMethod: 'OAuth Token'
        password: '$(System.AccessToken)'
        enableBuildInQueueCondition: false
        dependentOnSuccessfulBuildCondition: false
        dependentOnFailedBuildCondition: false
        checkbuildsoncurrentbranch: false
        failTaskIfBuildsNotSuccessful: true
      displayName: 'Deploy Frontend Application'
    
    - script: |
        echo "=== Frontend Deployment Verification ==="
        echo "Waiting for frontend deployment to complete..."
        sleep 45
        
        FRONTEND_URL="https://app.lemotech.co.za"  # Update with actual domain
        
        for i in {1..8}; do
          echo "Frontend health check attempt $i/8..."
          
          if curl -f -s -o /dev/null "$FRONTEND_URL" 2>/dev/null; then
            echo "✅ Frontend application is accessible!"
            echo "🌐 Frontend URL: $FRONTEND_URL"
            break
          elif [ $i -eq 8 ]; then
            echo "⚠️ Frontend verification incomplete, but deployment may still be successful"
            echo "Please check Azure Static Web Apps deployment status"
          else
            echo "Frontend not ready, waiting 20 seconds..."
            sleep 20
          fi
        done
        
        echo "✅ Frontend deployment verification completed!"
      displayName: 'Verify Frontend Deployment'

# Stage 3: Admin Dashboard Deployment (depends on frontend success)
- stage: DeployAdminDashboard
  displayName: 'Deploy Admin Dashboard'
  dependsOn: DeployFrontend
  condition: succeeded()
  jobs:
  - job: TriggerAdminPipeline
    displayName: 'Trigger Admin Dashboard Deployment'
    steps:
    - script: |
        echo "=== Stage 3: Admin Dashboard Deployment ==="
        echo "Frontend deployment successful, proceeding with admin dashboard..."
      displayName: 'Initialize Admin Dashboard Deployment'
    
    - task: TriggerBuild@4
      inputs:
        definitionIsInCurrentTeamProject: true
        buildDefinition: 'azure-pipelines-admin'
        queueBuildForUserThatTriggeredBuild: true
        ignoreSslCertificateErrors: false
        useSameSourceVersion: true
        useCustomSourceVersion: false
        useSameBranch: true
        waitForQueuedBuildsToFinish: true
        storeInEnvironmentVariable: true
        authenticationMethod: 'OAuth Token'
        password: '$(System.AccessToken)'
        enableBuildInQueueCondition: false
        dependentOnSuccessfulBuildCondition: false
        dependentOnFailedBuildCondition: false
        checkbuildsoncurrentbranch: false
        failTaskIfBuildsNotSuccessful: true
      displayName: 'Deploy Admin Dashboard'
    
    - script: |
        echo "=== Admin Dashboard Deployment Verification ==="
        echo "Waiting for admin dashboard deployment to complete..."
        sleep 45
        
        ADMIN_URL="https://admin.lemotech.co.za"  # Update with actual domain
        
        for i in {1..8}; do
          echo "Admin dashboard health check attempt $i/8..."
          
          # Check if admin dashboard is accessible (may require auth)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ADMIN_URL" 2>/dev/null || echo "000")
          
          if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "401" ]] || [[ "$HTTP_CODE" == "302" ]]; then
            echo "✅ Admin dashboard is responding (HTTP $HTTP_CODE)!"
            echo "🔐 Admin URL: $ADMIN_URL"
            echo "Note: HTTP 401/302 expected for protected admin interface"
            break
          elif [ $i -eq 8 ]; then
            echo "⚠️ Admin dashboard verification incomplete, but deployment may still be successful"
            echo "Please check Azure Static Web Apps deployment status"
          else
            echo "Admin dashboard not ready (HTTP $HTTP_CODE), waiting 20 seconds..."
            sleep 20
          fi
        done
        
        echo "✅ Admin dashboard deployment verification completed!"
      displayName: 'Verify Admin Dashboard Deployment'

# Final Stage: Deployment Summary
- stage: DeploymentSummary
  displayName: 'Deployment Summary'
  dependsOn:
  - DeployBackend
  - DeployFrontend
  - DeployAdminDashboard
  condition: always()
  jobs:
  - job: SummarizeDeployment
    displayName: 'Generate Deployment Summary'
    steps:
    - script: |
        echo "=== 🚀 LemoTech Platform Deployment Summary ==="
        echo ""
        echo "Deployment Environment: $(deploymentEnvironment)"
        echo "Deployment Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Build Number: $(Build.BuildNumber)"
        echo "Source Version: $(Build.SourceVersion)"
        echo "Source Branch: $(Build.SourceBranch)"
        echo ""
        echo "=== 📋 Deployment Status ==="
        
        # Check stage results
        BACKEND_STATUS="${{ stageDependencies.DeployBackend.TriggerBackendPipeline.result }}"
        FRONTEND_STATUS="${{ stageDependencies.DeployFrontend.TriggerFrontendPipeline.result }}"
        ADMIN_STATUS="${{ stageDependencies.DeployAdminDashboard.TriggerAdminPipeline.result }}"
        
        echo "Backend API: $BACKEND_STATUS"
        echo "Frontend App: $FRONTEND_STATUS"
        echo "Admin Dashboard: $ADMIN_STATUS"
        echo ""
        echo "=== 🌐 Application URLs ==="
        echo "Backend API: https://lemotech-api-backend.azurewebsites.net"
        echo "Frontend App: https://app.lemotech.co.za"
        echo "Admin Dashboard: https://admin.lemotech.co.za"
        echo ""
        echo "=== 📚 Resources ==="
        echo "API Documentation: https://lemotech-api-backend.azurewebsites.net/api-docs"
        echo "Health Check: https://lemotech-api-backend.azurewebsites.net/health"
        echo "Azure Portal: https://portal.azure.com"
        echo ""
        
        if [[ "$BACKEND_STATUS" == "Succeeded" && "$FRONTEND_STATUS" == "Succeeded" && "$ADMIN_STATUS" == "Succeeded" ]]; then
          echo "✅ 🎉 ALL DEPLOYMENTS SUCCESSFUL! 🎉 ✅"
          echo ""
          echo "The LemoTech platform is now fully deployed and operational!"
        else
          echo "⚠️ Some deployments may have issues. Please check individual pipeline logs."
        fi
        
        echo ""
        echo "=== End of Deployment Summary ==="
      displayName: 'Display Deployment Summary'

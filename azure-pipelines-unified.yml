# LemoTech Unified Deployment Pipeline
# Intelligent deployment that detects changes and deploys only what's needed

trigger:
  branches:
    include:
    - master
    - main
  paths:
    exclude:
    - docs/*
    - README.md
    - "*.md"

pool:
  name: 'Default'

variables:
  - group: LemoTech-Production-Variables
  - name: nodeVersion
    value: '20.x'
  - name: NPM_CONFIG_PRODUCTION
    value: false
  - name: environmentName
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'production'
    ${{ else }}:
      value: 'development'
  # Production URLs use custom domain, development uses Azure defaults
  - name: frontendUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://icy-wave-09632e003.1.azurestaticapps.net'
  - name: backendUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://api.lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://lemotech-api-backend.azurewebsites.net'
  - name: adminUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://admin.lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://thankful-pond-0e9607803.1.azurestaticapps.net'
  
  # DNS settings for custom domain validation
  - name: dnsZoneName
    value: 'lemotechinnovations.co.za'
  - name: dnsResourceGroup
    value: 'lemotech-platform'

stages:
- stage: DetectChanges
  displayName: 'Detect Changes and Plan Deployment'
  jobs:
  - job: AnalyzeChanges
    displayName: 'Analyze Changed Files'
    steps:
    - script: |
        echo "=== Installing Docker if not present ==="
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $(whoami)
        else
          echo "✅ Docker already installed: $(docker --version)"
        fi
      displayName: 'Install Docker for Azure Static Web Apps'
      
    - script: |
        echo "=== Cleaning up workspace ==="
        sudo chmod -R 777 . 2>/dev/null || echo "Permissions already correct"
        rm -rf node_modules .git/index.lock 2>/dev/null || echo "No cleanup needed"
      displayName: 'Pre-checkout Cleanup'
      
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
      
    - checkout: self
      fetchDepth: 2
      clean: true
      displayName: 'Checkout with History'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "repo ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - script: |
        echo "=== LemoTech Intelligent Deployment System ==="
        echo "Analyzing changes to determine deployment strategy..."
        echo ""
        
        # Get changed files between this commit and the previous one
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          echo "Pull Request detected, comparing with target branch..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          echo "Direct push detected, comparing with previous commit..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        echo ""
        
        # Initialize deployment flags
        DEPLOY_BACKEND=false
        DEPLOY_FRONTEND=false
        DEPLOY_ADMIN=false
        
        # Check for backend changes
        if echo "$CHANGED_FILES" | grep -E "^(backend/|src/|\.deployment|azure-pipelines-backend\.yml|package\.json)" > /dev/null; then
          echo "🔄 Backend changes detected!"
          DEPLOY_BACKEND=true
        fi
        
        # Check for frontend changes
        if echo "$CHANGED_FILES" | grep -E "^(frontend/|src/|azure-pipelines-frontend\.yml)" > /dev/null; then
          echo "🔄 Frontend changes detected!"
          DEPLOY_FRONTEND=true
        fi
        
        # Check for admin dashboard changes
        if echo "$CHANGED_FILES" | grep -E "^(admin-dashboard/|src/|azure-pipelines-admin\.yml)" > /dev/null; then
          echo "🔄 Admin dashboard changes detected!"
          DEPLOY_ADMIN=true
        fi
        
        # Check for template changes (affects all)
        if echo "$CHANGED_FILES" | grep -E "^templates/" > /dev/null; then
          echo "🔄 Template changes detected - will deploy all applications!"
          DEPLOY_BACKEND=true
          DEPLOY_FRONTEND=true
          DEPLOY_ADMIN=true
        fi
        
        # Let pipeline decide based on actual code changes
        echo "🔄 Deployment will be based on actual code changes detected"
        
        echo ""
        echo "=== Deployment Plan ==="
        echo "Backend API: $DEPLOY_BACKEND"
        echo "Frontend App: $DEPLOY_FRONTEND"
        echo "Admin Dashboard: $DEPLOY_ADMIN"
        echo ""
        
        # Set pipeline variables
        echo "##vso[task.setvariable variable=deployBackend;isOutput=true]$DEPLOY_BACKEND"
        echo "##vso[task.setvariable variable=deployFrontend;isOutput=true]$DEPLOY_FRONTEND"
        echo "##vso[task.setvariable variable=deployAdmin;isOutput=true]$DEPLOY_ADMIN"
        
        echo "✅ Change analysis completed!"
      displayName: 'Analyze Changed Files'
      name: 'changes'

- stage: InstallDependencies
  displayName: 'Install Required Tools'
  dependsOn: DetectChanges
  jobs:
  - job: SetupAgent
    displayName: 'Setup Self-Hosted Agent'
    steps:
    - script: |
        echo "=== Agent Environment Setup ==="
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Name: $(Agent.Name)"
        echo "Working Directory: $(System.DefaultWorkingDirectory)"
        echo "Node.js Version Required: $(nodeVersion)"
        echo ""
        
        # Check current Node.js version
        if command -v node &> /dev/null; then
          echo "Current Node.js: $(node --version)"
        else
          echo "Node.js not found"
        fi
        
        # Check current npm version
        if command -v npm &> /dev/null; then
          echo "Current npm: $(npm --version)"
        else
          echo "npm not found"
        fi
      displayName: 'Check Agent Environment'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Azure CLI Installation for Self-Hosted Agent ==="
        
        # Check if Azure CLI is already available
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI already installed: $(az --version | head -1)"
          exit 0
        fi
        
        echo "Azure CLI not found, installing via pip..."
        
        # Install Azure CLI via pip (most reliable method)
        if command -v dnf &> /dev/null; then
          sudo dnf install -y python3-pip
        elif command -v apt-get &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y python3-pip
        elif command -v yum &> /dev/null; then
          sudo yum install -y python3-pip
        fi
        
        # Install Azure CLI
        pip3 install azure-cli
        
        # Add to PATH
        export PATH="$HOME/.local/bin:$PATH"
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
        
        # Verify installation
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI successfully installed!"
          echo "Version: $(az --version | head -1)"
        else
          echo "❌ Azure CLI installation failed"
          echo "Continuing without Azure CLI - using simplified deployment"
        fi
        
        echo "✅ Agent setup completed!"
      displayName: 'Install Azure CLI'

- stage: DeployApplications
  displayName: 'Deploy Applications'
  dependsOn: 
    - DetectChanges
    - InstallDependencies
  variables:
    deployBackend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployBackend'] ]
    deployFrontend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployFrontend'] ]
    deployAdmin: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployAdmin'] ]
  jobs:
  # Backend Deployment
  - job: DeployBackend
    displayName: 'Deploy Backend API'
    condition: eq(variables.deployBackend, 'true')
    variables:
      deploymentUrl: '$(backendUrl)'
    steps:
    - script: |
        echo "=== Cleaning workspace for backend deployment ==="
        sudo chmod -R 777 . 2>/dev/null || echo "Permissions OK"
        rm -rf node_modules 2>/dev/null || echo "No cleanup needed"
      displayName: 'Pre-deployment Cleanup'
      
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
      
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Backend API Deployment ==="
        echo "Deployment Target: $(deploymentUrl)"
        echo "Environment: $(environmentName)"
        cd backend
        echo "Current directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
        echo "Installing dependencies..."
        npm install --legacy-peer-deps --unsafe-perm
        
        echo "Running TypeScript build..."
        npx tsc -p tsconfig.prod.json
        
        echo "Running database migrations..."
        node scripts/migrate.js migrate --force
        
        echo "Verifying build output..."
        if [ -d "dist" ]; then
          echo "✅ Build successful - dist directory created"
          ls -la dist/
        else
          echo "❌ Build failed - dist directory not found"
          exit 1
        fi
      displayName: 'Build Backend'
    
    - script: |
        echo "=== Clean Backend Deployment with Dist Zip Approach ==="
        cd backend
        
        echo "Step 1: Install dependencies and build backend..."
        npm install --legacy-peer-deps --unsafe-perm
        npm run build
        
        # Verify build succeeded
        if [ -f "dist/app.js" ]; then
          echo "✅ Build successful - dist/app.js found"
          echo "Dist contents:"
          find dist/ -type f -name "*.js" | head -15
        else
          echo "❌ Build failed - dist/app.js not found"
          exit 1
        fi
        
        echo "Step 2: Run migrations to ensure database is ready..."
        node scripts/migrate.js migrate --force || echo "Migrations completed or already applied"
        
        echo "Step 3: Create dist zip for deployment..."
        cd dist
        
        # Verify all required backend folders exist
        echo "Verifying required backend dist structure:"
        for folder in config controllers hubs infrastructure middleware models repositories routes scripts services types utils; do
          if [ -d "$folder" ]; then
            echo "✅ $folder/ exists ($(ls $folder | wc -l) files)"
          else
            echo "⚠️ $folder/ missing"
          fi
        done
        
        # Create clean zip with ONLY dist contents
        zip -r ../backend-dist.zip . -x "*.map" "*.ts"
        cd ..
        
        echo "Step 4: Prepare final deployment package..."
        mkdir -p ../deploy-package
        cd ../deploy-package
        
        # Extract dist zip directly to deployment root
        unzip -q ../backend/backend-dist.zip
        
        # Create production package.json for the extracted files
        cat > package.json << 'EOF'
        {
          "name": "lemotech-backend",
          "version": "1.0.0",
          "main": "app.js",
          "scripts": {
            "start": "node app.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF
        
        # Copy dependencies from backend package.json
        node -e "
          const fs = require('fs');
          const backendPkg = JSON.parse(fs.readFileSync('../backend/package.json', 'utf8'));
          const deployPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          deployPkg.dependencies = backendPkg.dependencies;
          fs.writeFileSync('package.json', JSON.stringify(deployPkg, null, 2));
        "
        
        # Copy essential runtime files
        cp -r ../backend/src/infrastructure/migrations ./src/infrastructure/ 2>/dev/null || echo "Creating migrations structure"
        mkdir -p ./src/infrastructure
        cp -r ../backend/src/infrastructure/migrations ./src/infrastructure/
        cp ../backend/migrate.json ./
        cp -r ../backend/scripts ./
        
        echo "Step 5: Install production dependencies..."
        npm install --production --legacy-peer-deps --unsafe-perm
        
        echo "Step 6: Verify CLEAN backend dist deployment..."
        echo "=== BACKEND DIST DEPLOYMENT VERIFICATION ==="
        echo "✅ app.js:" $([ -f "app.js" ] && echo "EXISTS" || echo "MISSING")
        echo "✅ Backend folders:"
        for folder in config controllers hubs infrastructure middleware models repositories routes services types utils; do
          echo "  $folder/:" $([ -d "$folder" ] && echo "EXISTS ($(ls $folder/ 2>/dev/null | wc -l) files)" || echo "MISSING")
        done
        echo ""
        echo "🚫 Contamination check (should be 0):"
        echo "  admin-dashboard:" $(find . -name "*admin*" 2>/dev/null | wc -l)
        echo "  frontend:" $(find . -name "*frontend*" 2>/dev/null | wc -l)
        echo ""
        echo "✅ CLEAN BACKEND DIST DEPLOYMENT VERIFIED!"
      displayName: 'Prepare Deployment Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-package'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive Backend Package'
    
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'lemotech-api-backend'
        resourceGroupName: 'lemotech-platform'
        package: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        runtimeStack: 'NODE|20-lts'
        startUpCommand: 'node app.js'
        deploymentMethod: 'zipDeploy'
        appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -ENABLE_ORYX_BUILD false -WEBSITE_DISABLE_SCM_BUILD true -WEBSITE_RUN_FROM_PACKAGE 0 -WEBSITE_DISABLE_DEPLOYMENT_BUILD true -NODE_ENV production -PORT 8000 -PAYFAST_MERCHANT_ID dummy -PAYFAST_MERCHANT_KEY dummy -PAYFAST_PASSPHRASE dummy -WEBSITE_NODE_DEFAULT_VERSION ~20 -WEBSITE_HTTPLOGGING_RETENTION_DAYS 3'
      displayName: 'Deploy to Azure App Service'
    
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Cleaning wwwroot folder completely ==="
          
          # Stop the app first
          az webapp stop --resource-group lemotech-platform --name lemotech-api-backend
          echo "✅ App stopped for clean deployment"
          
          # Clean wwwroot via Kudu API
          echo "Cleaning /site/wwwroot/ completely..."
          
          # Get publishing credentials
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group lemotech-platform --name lemotech-api-backend --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Clean wwwroot via Kudu REST API
          curl -X DELETE "https://lemotech-api-backend.scm.azurewebsites.net/api/vfs/site/wwwroot/" \
            -u "$USERNAME:$PASSWORD" \
            -H "If-Match: *" || echo "Clean attempt via API"
          
          echo "✅ wwwroot cleaned - ready for clean backend deployment"
      displayName: 'Clean wwwroot Before Deployment'
    
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Configuring Azure App Service Settings ==="
          
          # Check current App Service plan
          echo "Current App Service Plan:"
          az appservice plan show \
            --resource-group lemotech-platform \
            --name $(az webapp show --resource-group lemotech-platform --name lemotech-api-backend --query appServicePlanId --output tsv | xargs basename) \
            --query "{name:name, tier:sku.tier, size:sku.size, capacity:sku.capacity}"
          
          # Set timeout and performance settings
          az webapp config appsettings set \
            --resource-group lemotech-platform \
            --name lemotech-api-backend \
            --settings \
              SCM_COMMAND_IDLE_TIMEOUT=1200 \
              WEBJOBS_IDLE_TIMEOUT=1200 \
              WEBSITE_TIME_ZONE="UTC" \
              WEBSITE_HTTPLOGGING_RETENTION_DAYS=3 \
              WEBSITE_DYNAMIC_CACHE=0 \
              WEBSITE_LOCAL_CACHE_OPTION=Never \
              WEBSITE_NODE_DEFAULT_VERSION="~20" \
              CUSTOM_STARTUP_COMMAND="node app.js" \
              NODE_ENV="$(environmentName)" \
              FRONTEND_URL="$(frontendUrl)" \
              ADMIN_URL="$(adminUrl)" \
              BACKEND_URL="$(backendUrl)" \
              CORS_ORIGIN="$(frontendUrl),$(adminUrl)"
          
          echo "✅ Timeout and performance settings configured"
          
          # Start the app after clean deployment
          az webapp start --resource-group lemotech-platform --name lemotech-api-backend
          echo "✅ App restarted with clean backend deployment"
      displayName: 'Configure App Service and Restart'
    
    - script: |
        echo "=== Backend Health Check ==="
        echo "Checking backend health at: $(deploymentUrl)/health"
        echo "Environment: $(environmentName)"
        sleep 60
        
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          if curl -f -s -o /dev/null "$(deploymentUrl)/health" 2>/dev/null; then
            echo "✅ Backend is healthy!"
            echo "Backend successfully deployed to: $(deploymentUrl)"
            break
          elif [ $i -eq 10 ]; then
            echo "⚠️ Backend health check timeout for $(deploymentUrl)"
          else
            echo "Backend not ready, waiting 30 seconds..."
            sleep 30
          fi
        done
      displayName: 'Verify Backend Health'

  # Frontend Deployment
  - job: DeployFrontend
    displayName: 'Deploy Frontend App'
    condition: eq(variables.deployFrontend, 'true')
    dependsOn: DeployBackend
    variables:
      deploymentUrl: '$(frontendUrl)'
    steps:
    - script: |
        echo "=== Ensuring Docker is available for deployment ==="
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          sudo apt-get update -q
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $(whoami)
          echo "✅ Docker installed: $(docker --version)"
        else
          echo "✅ Docker already available: $(docker --version)"
        fi
      displayName: 'Ensure Docker Available'
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
    
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package.json'
        path: frontend/node_modules
        restoreKeys: |
          npm | "$(Agent.OS)"
      displayName: 'Cache frontend node_modules'
    
    - script: |
        echo "=== Frontend: Clean & Build ==="
        cd frontend
        pwd
        echo "Node $(node --version) NPM $(npm --version)"
        
        echo "Step 1: Create $(environmentName) environment..."
        # Create environment file based on deployment target
        cat > .env << EOF
        VITE_API_BASE_URL=$(frontendUrl)
        VITE_ENVIRONMENT=$(environmentName)
        VITE_APP_TITLE=LemoTech - On-Demand Cleaning
        EOF
        
        echo "Frontend will connect to: $(frontendUrl)"
        
        # Debug environment before npm install
        echo "=== PRE-INSTALL DEBUG ==="
        echo "Current directory: $(pwd)"
        echo "User: $(whoami)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "NPM config:"
        npm config list
        echo "Directory contents:"
        ls -la
        echo "=== END PRE-INSTALL DEBUG ==="

        # Ensure devDependencies ARE installed for build
        export NPM_CONFIG_PRODUCTION=false
        echo "NPM_CONFIG_PRODUCTION=$NPM_CONFIG_PRODUCTION"

        # Prefer reproducible install under CI - require package-lock.json in repo
        echo "Checking for package-lock.json..."
        ls -la package*.json || echo "No package files found"
        
        if [ -f package-lock.json ]; then
          echo "✅ Using package-lock.json -> npm ci"
          echo "Running: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm"
          npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm ci failed with exit code: $?"
            echo "=== NPM CI OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
          }
        else
          echo "⚠️  No package-lock.json; falling back to npm install"
          echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
          npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm install failed with exit code: $?"
            echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
          }
        fi
        
        echo "=== POST-INSTALL DEBUG ==="
        echo "✅ npm install completed, checking results..."
        echo "npm-install.log contents:"
        cat npm-install.log || echo "No npm-install.log found"
        echo ""
        echo "Directory contents after install:"
        ls -la
        echo "node_modules contents:"
        ls -la node_modules/ | head -20 || echo "No node_modules directory"
        echo "node_modules/.bin contents:"
        ls -la node_modules/.bin | head -10 || echo "No .bin directory"
        echo "=== END POST-INSTALL DEBUG ==="

        # Verify vite binary exists
        echo "Checking for vite"
        if ! npx vite --version >/dev/null 2>&1; then
          echo "vite not found; ensure devDependencies include vite"
          npm ls vite || echo "vite not installed"
          echo "Installing vite as fallback..."
          npm install --save-dev vite --legacy-peer-deps --unsafe-perm
        fi
        echo "Vite version: $(npx vite --version || echo 'npx vite failed')"

        # Show npm install log regardless of success/failure
        echo "=== FINAL NPM INSTALL LOG REVIEW ==="
        if [ -f npm-install.log ]; then
          echo "npm-install.log file exists ($(wc -l < npm-install.log) lines):"
          cat npm-install.log
        else
          echo "No npm-install.log file found"
        fi
        echo "=== END NPM INSTALL LOG REVIEW ==="

        # Build (prefer package.json script if present)
        if grep -q "\"build\"\s*:\s*\".*vite build" package.json; then
          echo "Running npm run build"
          npm run build --if-present 2>&1 | tee build.log || {
            echo "❌ npm run build failed"
            echo "Build log contents:"
            cat build.log || echo "No build log"
            exit 1
          }
        else
          echo "Running npx vite build"
          npx vite build 2>&1 | tee build.log || {
            echo "❌ npx vite build failed"
            echo "Build log contents:"
            cat build.log || echo "No build log"
          exit 1
        }
        fi
        
        # Verify build output
        if [ -d "dist" ]; then
          echo "✅ Frontend build completed; dist created ($(find dist -type f | wc -l) files)"
          ls -la dist | head -n 20
        else
          echo "❌ Frontend build failed: dist not found"
          echo "Workspace contents:"
          ls -la
          echo "Checking for any build logs:"
          cat build.log || echo "No build.log found"
          echo "Final npm-install.log review:"
          cat npm-install.log || echo "No npm-install.log found"
          exit 1
        fi
        
        echo "Step 5: Create clean deployment package..."
        cd dist
        
        # Create frontend dist zip
        zip -r ../frontend-dist.zip . -x "*.map"
        cd ..
        
        echo "✅ Frontend deployment package ready!"
      displayName: 'Build Frontend (robust)'
    
    - task: AzureStaticWebApp@0
      inputs:
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
        app_location: '/frontend'
        output_location: 'dist'
        skip_app_build: true
      displayName: 'Deploy Frontend to Azure Static Web Apps'

  # Admin Dashboard Deployment
  - job: DeployAdmin
    displayName: 'Deploy Admin Dashboard'
    condition: eq(variables.deployAdmin, 'true')
    dependsOn: DeployFrontend
    variables:
      deploymentUrl: '$(adminUrl)'
    steps:
    - script: |
        echo "=== Ensuring Docker is available for deployment ==="
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          sudo apt-get update -q
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $(whoami)
          echo "✅ Docker installed: $(docker --version)"
        else
          echo "✅ Docker already available: $(docker --version)"
        fi
      displayName: 'Ensure Docker Available'
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
    
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | admin-dashboard/package.json | admin-dashboard/package-lock.json'
        path: admin-dashboard/node_modules
        restoreKeys: |
          npm | "$(Agent.OS)"
      displayName: 'Cache admin-dashboard node_modules'
    
    - script: |
        echo "=== Admin Dashboard: Clean & Build ==="
        cd admin-dashboard
        pwd
        echo "Node $(node --version) NPM $(npm --version)"
        
        echo "Step 1: Create $(environmentName) environment..."
        # Create environment file based on deployment target
        cat > .env << EOF
        VITE_API_BASE_URL=$(adminUrl)
        VITE_ENVIRONMENT=$(environmentName)
        VITE_APP_TITLE=LemoTech Admin Dashboard
        VITE_REQUIRE_AUTH=true
        EOF
        
        echo "Admin will connect to: $(adminUrl)"
        
        # Debug environment before npm install
        echo "=== PRE-INSTALL DEBUG ==="
        echo "Current directory: $(pwd)"
        echo "User: $(whoami)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "NPM config:"
        npm config list
        echo "Directory contents:"
        ls -la
        echo "=== END PRE-INSTALL DEBUG ==="

        export NPM_CONFIG_PRODUCTION=false
        echo "NPM_CONFIG_PRODUCTION=$NPM_CONFIG_PRODUCTION"

        echo "Checking for package-lock.json..."
        ls -la package*.json || echo "No package files found"
        
        if [ -f package-lock.json ]; then
          echo "✅ Using package-lock.json -> npm ci"
          echo "Running: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm"
          npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm ci failed with exit code: $?"
            echo "=== NPM CI OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
          }
        else
          echo "⚠️  No package-lock.json; falling back to npm install"
          echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
          npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm install failed with exit code: $?"
            echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
          }
        fi
        
        echo "=== POST-INSTALL DEBUG ==="
        echo "✅ npm install completed, checking results..."
        echo "npm-install.log contents:"
        cat npm-install.log || echo "No npm-install.log found"
        echo ""
        echo "Directory contents after install:"
        ls -la
        echo "node_modules contents:"
        ls -la node_modules/ | head -20 || echo "No node_modules directory"
        echo "node_modules/.bin contents:"
        ls -la node_modules/.bin | head -10 || echo "No .bin directory"
        echo "=== END POST-INSTALL DEBUG ==="

        # Make sure vite exists or install
        if ! npx vite --version >/dev/null 2>&1; then
          echo "vite not installed — checking package.json"
          npm ls vite || echo "vite missing; installing as devDep..."
          npm install --save-dev vite --legacy-peer-deps --unsafe-perm
        fi
        npx vite --version || true

        # Build
        if grep -q "\"build\"\s*:\s*\".*vite build" package.json; then
          npm run build --if-present
        else
          npx vite build
        fi

        if [ -d "dist" ]; then
          echo "✅ Admin build successful"
        else
          echo "❌ Admin build failed: dist missing"
          ls -la
          exit 1
        fi
        
        echo "Step 4: Verify build output..."
        echo "Checking for dist directory..."
        if [ -d "dist" ]; then
          echo "✅ Admin dashboard build successful!"
          
          # Add security configuration for Static Web Apps
          echo '{
            "routes": [
              {
                "route": "/*",
                "serve": "/index.html",
                "statusCode": 200,
                "allowedRoles": ["admin", "manager"]
              }
            ],
            "responseOverrides": {
              "401": {
                "redirect": "/login",
                "statusCode": 302
              }
            },
            "globalHeaders": {
              "X-Frame-Options": "DENY",
              "X-Content-Type-Options": "nosniff",
              "Strict-Transport-Security": "max-age=31536000"
            }
          }' > dist/staticwebapp.config.json
          
          echo "Build contents:"
          find dist/ -type f | head -10
          echo "Total files: $(find dist/ -type f | wc -l)"
        else
          echo "❌ Admin dashboard build failed!"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
        
        echo "Step 5: Create clean deployment package..."
        cd dist
        
        # Create admin dist zip
        zip -r ../admin-dist.zip . -x "*.map"
        cd ..
        
        echo "✅ Admin dashboard deployment package ready!"
      displayName: 'Build Admin Dashboard (robust)'
    
    - task: AzureStaticWebApp@0
      inputs:
        azure_static_web_apps_api_token: '$(AZURE_ADMIN_STATIC_WEB_APPS_API_TOKEN)'
        app_location: '/admin-dashboard'
        output_location: 'dist'
        skip_app_build: true
      displayName: 'Deploy Admin Dashboard to Azure Static Web Apps'

- stage: DeploymentSummary
  displayName: 'Deployment Summary'
  dependsOn: DeployApplications
  condition: always()
  jobs:
  - job: Summary
    displayName: 'Generate Summary'
    steps:
    - script: |
        echo "=== 🚀 LemoTech Deployment Complete! ==="
        echo ""
        echo "Build: $(Build.BuildNumber)"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo ""
        echo "🌐 Application URLs:"
        echo "Backend API: https://lemotech-api-backend.azurewebsites.net"
        echo "Frontend: Check Azure Static Web Apps for URL"
        echo "Admin: Check Azure Static Web Apps for URL"
        echo ""
        echo "✅ Deployment completed successfully!"
      displayName: 'Display Summary'

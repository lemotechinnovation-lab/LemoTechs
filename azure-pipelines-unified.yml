# LemoTech Unified Deployment Pipeline
# Intelligent deployment that detects changes and deploys only what's needed

trigger:
  branches:
    include:
    - master
    - main
  paths:
    exclude:
    - docs/*
    - README.md
    - "*.md"

pool:
  name: 'Default'

variables:
  - group: LemoTech-Production-Variables
  - name: nodeVersion
    value: '20.x'
  - name: NPM_CONFIG_PRODUCTION
    value: false
  - name: environmentName
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'production'
    ${{ else }}:
      value: 'development'
  # Production URLs use custom domain, development uses Azure defaults
  - name: frontendUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://lemotech-frontend-avbgchgjexfdbpa7.southafricanorth-01.azurewebsites.net'
  - name: backendUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://api.lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://lemotech-api-backend.azurewebsites.net'
  - name: adminUrl
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      value: 'https://admin.lemotechinnovations.co.za'
    ${{ else }}:
      value: 'https://lemotech-admin-aya0hbfgc2dbh8c0.southafricanorth-01.azurewebsites.net'
  
  # DNS settings for custom domain validation
  - name: dnsZoneName
    value: 'lemotechinnovations.co.za'
  - name: dnsResourceGroup
    value: 'lemotech-platform'

stages:
- stage: DetectChanges
  displayName: 'Detect Changes and Plan Deployment'
  jobs:
  - job: AnalyzeChanges
    displayName: 'Analyze Changed Files'
    steps:
    - script: |
        echo "=== Cleaning up workspace ==="
        sudo chmod -R 777 . 2>/dev/null || echo "Permissions already correct"
        rm -rf node_modules .git/index.lock 2>/dev/null || echo "No cleanup needed"
      displayName: 'Pre-checkout Cleanup'
      
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
      
    - checkout: self
      fetchDepth: 2
      clean: true
      displayName: 'Checkout with History'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "repo ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - script: |
        echo "=== LemoTech Intelligent Deployment System ==="
        echo "Analyzing changes to determine deployment strategy..."
        echo ""
        
        # Get changed files between this commit and the previous one
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          echo "Pull Request detected, comparing with target branch..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          echo "Direct push detected, comparing with previous commit..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        echo ""
        
        # Initialize deployment flags
        DEPLOY_BACKEND=false
        DEPLOY_FRONTEND=false
        DEPLOY_ADMIN=false
        
        # Check for backend changes
        if echo "$CHANGED_FILES" | grep -E "^(backend/|src/|\.deployment|azure-pipelines-backend\.yml|package\.json)" > /dev/null; then
          echo "🔄 Backend changes detected!"
          DEPLOY_BACKEND=true
        fi
        
        # Check for frontend changes
        if echo "$CHANGED_FILES" | grep -E "^(frontend/|src/|azure-pipelines-frontend\.yml)" > /dev/null; then
          echo "🔄 Frontend changes detected!"
          DEPLOY_FRONTEND=true
        fi
        
        # Check for admin dashboard changes
        if echo "$CHANGED_FILES" | grep -E "^(admin-dashboard/|src/|azure-pipelines-admin\.yml)" > /dev/null; then
          echo "🔄 Admin dashboard changes detected!"
          DEPLOY_ADMIN=true
        fi
        
        # Check for template changes (affects all)
        if echo "$CHANGED_FILES" | grep -E "^templates/" > /dev/null; then
          echo "🔄 Template changes detected - will deploy all applications!"
          DEPLOY_BACKEND=true
          DEPLOY_FRONTEND=true
          DEPLOY_ADMIN=true
        fi
        
        # Let pipeline decide based on actual code changes
        echo "🔄 Deployment will be based on actual code changes detected"
        
        echo ""
        echo "=== Deployment Plan ==="
        echo "Backend API: $DEPLOY_BACKEND"
        echo "Frontend App: $DEPLOY_FRONTEND"
        echo "Admin Dashboard: $DEPLOY_ADMIN"
        echo ""
        
        # Set pipeline variables
        echo "##vso[task.setvariable variable=deployBackend;isOutput=true]$DEPLOY_BACKEND"
        echo "##vso[task.setvariable variable=deployFrontend;isOutput=true]$DEPLOY_FRONTEND"
        echo "##vso[task.setvariable variable=deployAdmin;isOutput=true]$DEPLOY_ADMIN"
        
        echo "✅ Change analysis completed!"
      displayName: 'Analyze Changed Files'
      name: 'changes'

- stage: InstallDependencies
  displayName: 'Install Required Tools'
  dependsOn: DetectChanges
  jobs:
  - job: SetupAgent
    displayName: 'Setup Self-Hosted Agent'
    steps:
    - script: |
        echo "=== Agent Environment Setup ==="
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Name: $(Agent.Name)"
        echo "Working Directory: $(System.DefaultWorkingDirectory)"
        echo "Node.js Version Required: $(nodeVersion)"
        echo ""
        
        # Check current Node.js version
        if command -v node &> /dev/null; then
          echo "Current Node.js: $(node --version)"
        else
          echo "Node.js not found"
        fi
        
        # Check current npm version
        if command -v npm &> /dev/null; then
          echo "Current npm: $(npm --version)"
        else
          echo "npm not found"
        fi
      displayName: 'Check Agent Environment'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Azure CLI Installation for Self-Hosted Agent ==="
        
        # Check if Azure CLI is already available
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI already installed: $(az --version | head -1)"
          exit 0
        fi
        
        echo "Azure CLI not found, installing via pip..."
        
        # Install Azure CLI via pip (most reliable method)
        if command -v dnf &> /dev/null; then
          sudo dnf install -y python3-pip
        elif command -v apt-get &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y python3-pip
        elif command -v yum &> /dev/null; then
          sudo yum install -y python3-pip
        fi
        
        # Install Azure CLI
        pip3 install azure-cli
        
        # Add to PATH
        export PATH="$HOME/.local/bin:$PATH"
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
        
        # Verify installation
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI successfully installed!"
          echo "Version: $(az --version | head -1)"
        else
          echo "❌ Azure CLI installation failed"
          echo "Continuing without Azure CLI - using simplified deployment"
        fi
        
        echo "✅ Agent setup completed!"
      displayName: 'Install Azure CLI'

- stage: DeployApplications
  displayName: 'Deploy Applications'
  dependsOn: 
    - DetectChanges
    - InstallDependencies
  variables:
    deployBackend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployBackend'] ]
    deployFrontend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployFrontend'] ]
    deployAdmin: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployAdmin'] ]
  jobs:
  # Backend Deployment
  - job: DeployBackend
    displayName: 'Deploy Backend API'
    condition: eq(variables.deployBackend, 'true')
    variables:
      deploymentUrl: '$(backendUrl)'
    steps:
    - script: |
        echo "=== Cleaning workspace for backend deployment ==="
        sudo chmod -R 777 . 2>/dev/null || echo "Permissions OK"
        rm -rf node_modules 2>/dev/null || echo "No cleanup needed"
      displayName: 'Pre-deployment Cleanup'
      
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
      
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Backend API Deployment ==="
        echo "Deployment Target: $(deploymentUrl)"
        echo "Environment: $(environmentName)"
        cd backend
        echo "Current directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
        echo "Installing dependencies..."
        npm install --legacy-peer-deps --unsafe-perm
        
        echo "Running TypeScript build..."
        npx tsc -p tsconfig.prod.json
        
        echo "Running database migrations..."
        node scripts/migrate.js migrate --force
        
        echo "Verifying build output..."
        if [ -d "dist" ]; then
          echo "✅ Build successful - dist directory created"
          ls -la dist/
        else
          echo "❌ Build failed - dist directory not found"
          exit 1
        fi
      displayName: 'Build Backend'
    
    - script: |
        echo "=== Clean Backend Deployment with Dist Zip Approach ==="
        cd backend
        
        echo "Step 1: Install dependencies and build backend..."
        npm install --legacy-peer-deps --unsafe-perm
        npm run build
        
        # Verify build succeeded
        if [ -f "dist/app.js" ]; then
          echo "✅ Build successful - dist/app.js found"
          echo "Dist contents:"
          find dist/ -type f -name "*.js" | head -15
        else
          echo "❌ Build failed - dist/app.js not found"
          exit 1
        fi
        
        echo "Step 2: Run migrations to ensure database is ready..."
        node scripts/migrate.js migrate --force || echo "Migrations completed or already applied"
        
        echo "Step 3: Create dist zip for deployment..."
        cd dist
        
        # Verify all required backend folders exist
        echo "Verifying required backend dist structure:"
        for folder in config controllers hubs infrastructure middleware models repositories routes scripts services types utils; do
          if [ -d "$folder" ]; then
            echo "✅ $folder/ exists ($(ls $folder | wc -l) files)"
          else
            echo "⚠️ $folder/ missing"
          fi
        done
        
        # Create clean zip with ONLY dist contents
        zip -r ../backend-dist.zip . -x "*.map" "*.ts"
        cd ..
        
        echo "Step 4: Prepare final deployment package..."
        mkdir -p ../deploy-package
        cd ../deploy-package
        
        # Extract dist zip directly to deployment root
        unzip -q ../backend/backend-dist.zip
        
        # Create production package.json for the extracted files
        cat > package.json << 'EOF'
        {
          "name": "lemotech-backend",
          "version": "1.0.0",
          "main": "app.js",
          "scripts": {
            "start": "node app.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF
        
        # Copy dependencies from backend package.json
        node -e "
          const fs = require('fs');
          const backendPkg = JSON.parse(fs.readFileSync('../backend/package.json', 'utf8'));
          const deployPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          deployPkg.dependencies = backendPkg.dependencies;
          fs.writeFileSync('package.json', JSON.stringify(deployPkg, null, 2));
        "
        
        # Copy essential runtime files
        cp -r ../backend/src/infrastructure/migrations ./src/infrastructure/ 2>/dev/null || echo "Creating migrations structure"
        mkdir -p ./src/infrastructure
        cp -r ../backend/src/infrastructure/migrations ./src/infrastructure/
        cp ../backend/migrate.json ./
        cp -r ../backend/scripts ./
        
        echo "Step 5: Install production dependencies..."
        npm install --production --legacy-peer-deps --unsafe-perm
        
        echo "Step 6: Verify CLEAN backend dist deployment..."
        echo "=== BACKEND DIST DEPLOYMENT VERIFICATION ==="
        echo "✅ app.js:" $([ -f "app.js" ] && echo "EXISTS" || echo "MISSING")
        echo "✅ Backend folders:"
        for folder in config controllers hubs infrastructure middleware models repositories routes services types utils; do
          echo "  $folder/:" $([ -d "$folder" ] && echo "EXISTS ($(ls $folder/ 2>/dev/null | wc -l) files)" || echo "MISSING")
        done
        echo ""
        echo "🚫 Contamination check (should be 0):"
        echo "  admin-dashboard:" $(find . -name "*admin*" 2>/dev/null | wc -l)
        echo "  frontend:" $(find . -name "*frontend*" 2>/dev/null | wc -l)
        echo ""
        echo "✅ CLEAN BACKEND DIST DEPLOYMENT VERIFIED!"
      displayName: 'Prepare Deployment Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-package'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive Backend Package'
    
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'lemotech-api-backend'
        resourceGroupName: 'lemotech-platform'
        package: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        runtimeStack: 'NODE|20-lts'
        startUpCommand: 'node app.js'
        deploymentMethod: 'zipDeploy'
        appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -ENABLE_ORYX_BUILD false -WEBSITE_DISABLE_SCM_BUILD true -WEBSITE_RUN_FROM_PACKAGE 0 -WEBSITE_DISABLE_DEPLOYMENT_BUILD true -NODE_ENV production -PORT 8000 -PAYFAST_MERCHANT_ID dummy -PAYFAST_MERCHANT_KEY dummy -PAYFAST_PASSPHRASE dummy -WEBSITE_NODE_DEFAULT_VERSION ~20 -WEBSITE_HTTPLOGGING_RETENTION_DAYS 3'
      displayName: 'Deploy to Azure App Service'
    
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Cleaning wwwroot folder completely ==="
          
          # Stop the app first
          az webapp stop --resource-group lemotech-platform --name lemotech-api-backend
          echo "✅ App stopped for clean deployment"
          
          # Clean wwwroot via Kudu API
          echo "Cleaning /site/wwwroot/ completely..."
          
          # Get publishing credentials
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group lemotech-platform --name lemotech-api-backend --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Clean wwwroot via Kudu REST API
          curl -X DELETE "https://lemotech-api-backend.scm.azurewebsites.net/api/vfs/site/wwwroot/" \
            -u "$USERNAME:$PASSWORD" \
            -H "If-Match: *" || echo "Clean attempt via API"
          
          echo "✅ wwwroot cleaned - ready for clean backend deployment"
      displayName: 'Clean wwwroot Before Deployment'
    
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Configuring Azure App Service Settings ==="
          
          # Check current App Service plan
          echo "Current App Service Plan:"
          az appservice plan show \
            --resource-group lemotech-platform \
            --name $(az webapp show --resource-group lemotech-platform --name lemotech-api-backend --query appServicePlanId --output tsv | xargs basename) \
            --query "{name:name, tier:sku.tier, size:sku.size, capacity:sku.capacity}"
          
          # Set timeout and performance settings
          az webapp config appsettings set \
            --resource-group lemotech-platform \
            --name lemotech-api-backend \
            --settings \
              SCM_COMMAND_IDLE_TIMEOUT=1200 \
              WEBJOBS_IDLE_TIMEOUT=1200 \
              WEBSITE_TIME_ZONE="UTC" \
              WEBSITE_HTTPLOGGING_RETENTION_DAYS=3 \
              WEBSITE_DYNAMIC_CACHE=0 \
              WEBSITE_LOCAL_CACHE_OPTION=Never \
              WEBSITE_NODE_DEFAULT_VERSION="~20" \
              CUSTOM_STARTUP_COMMAND="node app.js" \
              NODE_ENV="$(environmentName)" \
              FRONTEND_URL="$(frontendUrl)" \
              ADMIN_URL="$(adminUrl)" \
              BACKEND_URL="$(backendUrl)" \
              CORS_ORIGIN="$(frontendUrl),$(adminUrl)"
          
          echo "✅ Timeout and performance settings configured"
          
          # Start the app after clean deployment
          az webapp start --resource-group lemotech-platform --name lemotech-api-backend
          echo "✅ App restarted with clean backend deployment"
      displayName: 'Configure App Service and Restart'
    
    - script: |
        echo "=== Backend Health Check ==="
        echo "Checking backend health at: $(deploymentUrl)/health"
        echo "Environment: $(environmentName)"
        sleep 60
        
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          if curl -f -s -o /dev/null "$(deploymentUrl)/health" 2>/dev/null; then
            echo "✅ Backend is healthy!"
            echo "Backend successfully deployed to: $(deploymentUrl)"
            break
          elif [ $i -eq 10 ]; then
            echo "⚠️ Backend health check timeout for $(deploymentUrl)"
          else
            echo "Backend not ready, waiting 30 seconds..."
            sleep 30
          fi
        done
      displayName: 'Verify Backend Health'

  # Frontend Deployment
  - job: DeployFrontend
    displayName: 'Deploy Frontend App'
    condition: eq(variables.deployFrontend, 'true')
    dependsOn: DeployBackend
    variables:
      deploymentUrl: '$(frontendUrl)'
    steps:
    - script: |
        echo "=== Ensuring Docker is available for deployment ==="
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          sudo apt-get update -q
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $(whoami)
          echo "✅ Docker installed: $(docker --version)"
        else
          echo "✅ Docker already available: $(docker --version)"
        fi
      displayName: 'Ensure Docker Available'
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
    
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package.json'
        path: frontend/node_modules
        restoreKeys: |
          npm | "$(Agent.OS)"
      displayName: 'Cache frontend node_modules'
    
    - script: |
        echo "=== Frontend: Clean & Build ==="
        cd frontend
        pwd
        echo "Node $(node --version) NPM $(npm --version)"
        
        echo "Step 1: Create $(environmentName) environment..."
        # Create environment file based on deployment target
        cat > .env << EOF
        VITE_API_BASE_URL=$(frontendUrl)
        VITE_ENVIRONMENT=$(environmentName)
        VITE_APP_TITLE=LemoTech - On-Demand Cleaning
        EOF
        
        echo "Frontend will connect to: $(frontendUrl)"
        
        # Debug environment before npm install
        echo "=== PRE-INSTALL DEBUG ==="
        echo "Current directory: $(pwd)"
        echo "User: $(whoami)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "NPM config:"
        npm config list
        echo "Directory contents:"
        ls -la
        echo "=== END PRE-INSTALL DEBUG ==="

        # Ensure devDependencies ARE installed for build
        export NPM_CONFIG_PRODUCTION=false
        echo "NPM_CONFIG_PRODUCTION=$NPM_CONFIG_PRODUCTION"

        # Prefer reproducible install under CI - require package-lock.json in repo
        echo "Checking for package-lock.json..."
        ls -la package*.json || echo "No package files found"
        
        if [ -f package-lock.json ]; then
          echo "✅ Using package-lock.json -> npm ci"
          echo "Running: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm"
          npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm ci failed, likely package-lock.json out of sync. Falling back to npm install..."
            echo "=== NPM CI OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
            npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
              echo "❌ npm install also failed with exit code: $?"
              echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
            }
          }
        else
          echo "⚠️  No package-lock.json; falling back to npm install"
          echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
          npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm install failed with exit code: $?"
            echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
          }
        fi
        
        echo "=== POST-INSTALL DEBUG ==="
        echo "✅ npm install completed, checking results..."
        echo "npm-install.log contents:"
        cat npm-install.log || echo "No npm-install.log found"
        echo ""
        echo "Directory contents after install:"
        ls -la
        echo "node_modules contents:"
        ls -la node_modules/ | head -20 || echo "No node_modules directory"
        echo "node_modules/.bin contents:"
        ls -la node_modules/.bin | head -10 || echo "No .bin directory"
        echo "=== END POST-INSTALL DEBUG ==="

        # Verify vite binary exists
        echo "Checking for vite"
        if ! npx vite --version >/dev/null 2>&1; then
          echo "vite not found; ensure devDependencies include vite"
          npm ls vite || echo "vite not installed"
          echo "Installing vite as fallback..."
          npm install --save-dev vite --legacy-peer-deps --unsafe-perm
        fi
        echo "Vite version: $(npx vite --version || echo 'npx vite failed')"

        # Show npm install log regardless of success/failure
        echo "=== FINAL NPM INSTALL LOG REVIEW ==="
        if [ -f npm-install.log ]; then
          echo "npm-install.log file exists ($(wc -l < npm-install.log) lines):"
          cat npm-install.log
        else
          echo "No npm-install.log file found"
        fi
        echo "=== END NPM INSTALL LOG REVIEW ==="

        # Ensure dev dependencies are available for build
        echo "=== Final dev dependency check ==="
        export NPM_CONFIG_PRODUCTION=false
        npm install --include=dev --legacy-peer-deps --unsafe-perm || echo "Dev dependency install completed with warnings"

        # Build (prefer npx to ensure vite is found)
        echo "=== Building frontend ==="
          npx vite build 2>&1 | tee build.log || {
          echo "❌ npx vite build failed, trying npm run build..."
          npm run build 2>&1 | tee build.log || {
            echo "❌ Both build methods failed"
            echo "Build log contents:"
            cat build.log || echo "No build log"
          exit 1
        }
        }
        
        # Verify build output
        if [ -d "dist" ]; then
          echo "✅ Frontend build completed; dist created ($(find dist -type f | wc -l) files)"
          echo "=== COMPLETE FRONTEND DIST CONTENTS ==="
          find dist -type f | sort
          echo "=== FRONTEND DIST DIRECTORY STRUCTURE ==="
          ls -la dist/
          if [ -d "dist/assets" ]; then
            echo "Assets directory: $(find dist/assets -type f | wc -l) files"
          fi
          if [ -d "dist/icons" ]; then
            echo "Icons directory: $(find dist/icons -type f | wc -l) files"
            ls -la dist/icons/
          else
            echo "⚠️ No icons directory in dist - will need to copy from public"
          fi
          
          # Check for specific expected files
          EXPECTED_DIST_FILES=(".htaccess" "browserconfig.xml" "manifest.json" "sw.js" "vite.svg" "index.html")
          for file in "${EXPECTED_DIST_FILES[@]}"; do
            if [ -f "dist/$file" ]; then
              echo "✅ Found in dist: $file"
            else
              echo "⚠️ Missing from dist: $file (will copy from public)"
            fi
          done
        else
          echo "❌ Frontend build failed: dist not found"
          echo "Workspace contents:"
          ls -la
          echo "Checking for any build logs:"
          cat build.log || echo "No build.log found"
          echo "Final npm-install.log review:"
          cat npm-install.log || echo "No npm-install.log found"
          exit 1
        fi
        
        echo "Step 5: Create clean deployment package..."
        cd dist
        
        # Create frontend dist zip
        zip -r ../frontend-dist.zip . -x "*.map"
        cd ..
        
        echo "✅ Frontend deployment package ready!"
      displayName: 'Build Frontend (robust)'
    
    - script: |
        echo "Step 2: Prepare App Service deployment package..."
        cd frontend
        rm -rf ../deploy-frontend || true
        mkdir -p ../deploy-frontend
        
        # Copy all dist files to deployment directory (including hidden files)
        echo "=== DEBUG: Files in dist before copy ==="
        find dist -type f -name "*" | head -20
        echo "=== DEBUG: Hidden files in dist ==="
        find dist -name ".*" -type f
        echo "=== DEBUG: All files in dist ==="
        ls -la dist/
        echo "=== DEBUG: Files in public directory ==="
        ls -la public/
        echo "=== DEBUG: Icons in public directory ==="
        ls -la public/icons/ || echo "No icons directory found"
        echo "=== DEBUG: Checking specific files ==="
        for file in .htaccess browserconfig.xml manifest.json sw.js vite.svg; do
          if [ -f "public/$file" ]; then
            echo "✓ Found: public/$file"
          else
            echo "✗ Missing: public/$file"
          fi
        done
        
        # PHASE 1: Copy all dist files (built files) with verification
        echo "=== COPYING ALL FRONTEND DIST FILES ==="
        echo "Source dist files:"
        find dist -type f | wc -l
        
        cp -r dist/. ../deploy-frontend/
        
        echo "After copying dist, deploy-frontend contains:"
        find ../deploy-frontend -type f | wc -l
        
        # PHASE 2: Verify all expected frontend dist files are present
        echo "=== Verifying expected frontend dist files ==="
        EXPECTED_FRONTEND_DIST=(
          "assets"
          "icons"
          ".htaccess"
          "browserconfig.xml"
          "index.html"
          "manifest.json"
          "sw.js"
          "vite.svg"
        )
        
        MISSING_FILES=()
        for item in "${EXPECTED_FRONTEND_DIST[@]}"; do
          if [ -e "../deploy-frontend/$item" ]; then
            echo "✅ Found expected: $item"
          else
            echo "❌ Missing expected: $item"
            MISSING_FILES+=("$item")
          fi
        done
        
        # PHASE 3: Force copy missing files from public if they exist
        if [ ${#MISSING_FILES[@]} -gt 0 ]; then
          echo "=== FORCE COPYING MISSING FILES FROM PUBLIC ==="
          for item in "${MISSING_FILES[@]}"; do
            if [ -e "public/$item" ]; then
              echo "🔄 Force copying missing $item from public..."
              if [ -d "public/$item" ]; then
                mkdir -p "../deploy-frontend/$item"
                cp -r "public/$item/." "../deploy-frontend/$item/"
              else
                cp "public/$item" "../deploy-frontend/$item"
              fi
              
              # Verify the copy worked
              if [ -e "../deploy-frontend/$item" ]; then
                echo "✅ Successfully copied $item from public"
              else
                echo "❌ Failed to copy $item from public"
              fi
            else
              echo "⚠️ $item not found in public directory either"
            fi
          done
        fi
        
        # Frontend should only use its own built dist files and public files
        echo "=== Checking what frontend build generated vs what's in public ==="
        
        # Check what Vite actually built in dist
        echo "=== What did frontend build actually generate in dist? ==="
        find dist -type f -name "*" | sort
        echo "=== Frontend dist directory structure ==="
        ls -la dist/
        if [ -d "dist/icons" ]; then
          echo "=== Frontend dist has icons directory ==="
          ls -la dist/icons/
        else
          echo "=== Frontend dist does NOT have icons directory ==="
        fi
        
        # Only copy public files that are NOT already in dist (to avoid duplicates)
        echo "=== Copying frontend's own public files (only if not in dist) ==="
        
        FRONTEND_PUBLIC_FILES=(
          "icons/android-chrome-192x192.png"
          "icons/android-chrome-512x512.png" 
          "icons/apple-touch-icon.png"
          "icons/favicon-16x16.png"
          "icons/favicon-32x32.png"
          "icons/favicon.ico"
          "icons/mstile-144x144.png"
          ".htaccess"
          "browserconfig.xml"
          "manifest.json"
          "sw.js"
          "vite.svg"
        )
        
        # Ensure icons directory exists
        mkdir -p ../deploy-frontend/icons
        
        # Copy each public file only if it's not already in dist
        for file in "${FRONTEND_PUBLIC_FILES[@]}"; do
          if [ -f "public/$file" ]; then
            if [ -f "dist/$file" ]; then
              echo "ℹ️  $file already in dist - using built version"
            else
              echo "✅ Copying frontend public $file (not in dist)..."
              cp "public/$file" "../deploy-frontend/$file" || echo "❌ Failed to copy $file"
              if [ -f "../deploy-frontend/$file" ]; then
                echo "   ✓ Confirmed: $file exists in deployment"
              else
                echo "   ✗ Missing: $file not found after copy"
              fi
            fi
          else
            echo "⚠️  Source missing: frontend public/$file not found"
          fi
        done
        
        # Copy any additional public assets that might exist (if not in dist)
        if [ -d "public/assets" ] && [ ! -d "dist/assets" ]; then
          echo "=== Copying additional frontend public assets (not in dist) ==="
          mkdir -p ../deploy-frontend/assets
          cp -r public/assets/* ../deploy-frontend/assets/ 2>/dev/null || echo "No additional assets found"
        elif [ -d "public/assets" ] && [ -d "dist/assets" ]; then
          echo "ℹ️  Assets already in dist - using built version"
        fi
        
        echo "=== DEBUG: Final files in deploy-frontend ==="
        find ../deploy-frontend -type f -name "*" | head -30
        echo "=== DEBUG: Hidden files in deploy-frontend ==="
        find ../deploy-frontend -name ".*" -type f
        echo "=== DEBUG: Directory structure ==="
        ls -la ../deploy-frontend/
        
        echo "=== FINAL VERIFICATION: What will be deployed to Azure Frontend ==="
        echo "Total files: $(find ../deploy-frontend -type f | wc -l)"
        echo "Directory structure:"
        find ../deploy-frontend -type d | sort
        echo "All files being deployed:"
        find ../deploy-frontend -type f | sort
        
        # Create minimal Node.js server for SPA serving
        cat > ../deploy-frontend/server.js << 'EOF'
        // Minimal Node.js server for SPA with client-side routing
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        const port = process.env.PORT || 8080;
        const root = path.resolve(__dirname);
        
        const mimeTypes = {
          '.html': 'text/html',
          '.js': 'application/javascript',
          '.css': 'text/css',
          '.json': 'application/json',
          '.png': 'image/png',
          '.jpg': 'image/jpeg',
          '.jpeg': 'image/jpeg',
          '.gif': 'image/gif',
          '.svg': 'image/svg+xml',
          '.ico': 'image/x-icon',
          '.woff': 'font/woff',
          '.woff2': 'font/woff2',
          '.ttf': 'font/ttf',
          '.eot': 'application/vnd.ms-fontobject'
        };
        
        function sendFile(res, filePath) {
          fs.readFile(filePath, (err, data) => {
            if (err) {
              console.error('Error reading file:', err);
              res.writeHead(500, {'Content-Type': 'text/plain'});
              res.end('Internal Server Error');
              return;
            }
            
            const ext = path.extname(filePath).toLowerCase();
            const contentType = mimeTypes[ext] || 'application/octet-stream';
            
            res.writeHead(200, {
              'Content-Type': contentType,
              'Cache-Control': ext === '.html' ? 'no-cache' : 'public, max-age=31536000'
            });
            res.end(data);
          });
        }
        
        const server = http.createServer((req, res) => {
          try {
            let reqPath = decodeURI(req.url.split('?')[0]);
            if (reqPath === '/') reqPath = '/index.html';
            
            const filePath = path.join(root, reqPath);
            
            fs.stat(filePath, (err, stats) => {
              if (err || !stats.isFile()) {
                // SPA fallback - serve index.html for client-side routing
                const indexPath = path.join(root, 'index.html');
                sendFile(res, indexPath);
              } else {
                sendFile(res, filePath);
              }
            });
          } catch (error) {
            console.error('Server error:', error);
            res.writeHead(500, {'Content-Type': 'text/plain'});
            res.end('Internal Server Error');
          }
        });
        
        server.listen(port, () => {
          console.log('Frontend SPA Server listening on port', port);
          console.log('Environment:', process.env.NODE_ENV || 'development');
        });
        
        process.on('SIGTERM', () => {
          console.log('SIGTERM received, shutting down gracefully');
          server.close(() => process.exit(0));
        });
        EOF

        # Create package.json for the SPA server
        cat > ../deploy-frontend/package.json << 'EOF'
        {
          "name": "lemotech-frontend-spa",
          "version": "1.0.0",
          "description": "LemoTech Frontend SPA Server",
          "main": "server.js",
          "scripts": {
            "start": "node server.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF

        echo "✅ Frontend App Service deployment package ready!"
        ls -la ../deploy-frontend/
        
        echo "=== PRE-ARCHIVE VERIFICATION: Frontend deploy directory ==="
        echo "Total files in deploy-frontend: $(find ../deploy-frontend -type f | wc -l)"
        echo "All files that will be archived:"
        find ../deploy-frontend -type f | sort
        echo "Directory sizes:"
        du -sh ../deploy-frontend/*
      displayName: 'Prepare Frontend App Service Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-frontend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive Frontend Package'

    - script: |
        echo "=== VERIFYING FRONTEND ZIP CONTENTS ==="
        cd "$(Build.ArtifactStagingDirectory)"
        echo "ZIP file size: $(ls -lh frontend-$(Build.BuildId).zip)"
        echo "ZIP contents:"
        unzip -l frontend-$(Build.BuildId).zip | head -50
        echo "=== END ZIP VERIFICATION ==="
      displayName: 'Verify Frontend ZIP Contents'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Cleaning Frontend App Service for Clean Deployment ==="
          RG='lemotech-platform'
          APP='lemotech-frontend'
          
          # Stop the app first
          echo "Stopping $APP..."
          az webapp stop --resource-group "$RG" --name "$APP"
          echo "✅ App stopped for clean deployment"
          
          # Clean wwwroot via Kudu API
          echo "Cleaning /site/wwwroot/ completely..."
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group $RG --name $APP --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Clean wwwroot via Kudu REST API
          curl -X DELETE "https://$APP.scm.azurewebsites.net/api/vfs/site/wwwroot/" \
            -u "$USERNAME:$PASSWORD" \
            -H "If-Match: *" || echo "Clean attempt via API completed"
          
          echo "✅ wwwroot cleaned - ready for clean frontend deployment"
      displayName: 'Clean Frontend App Service wwwroot'

    - script: |
        echo "=== PRE-DEPLOYMENT ZIP VERIFICATION ==="
        cd "$(Build.ArtifactStagingDirectory)"
        echo "ZIP file exists: $(ls -la frontend-$(Build.BuildId).zip)"
        echo "ZIP file size: $(du -h frontend-$(Build.BuildId).zip)"
        echo "Extracting ZIP to verify contents..."
        mkdir -p temp-extract
        unzip -q frontend-$(Build.BuildId).zip -d temp-extract
        echo "Extracted contents:"
        find temp-extract -type f | sort
        echo "Total extracted files: $(find temp-extract -type f | wc -l)"
        rm -rf temp-extract
      displayName: 'Pre-Deployment ZIP Verification'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'lemotech-frontend'
        resourceGroupName: 'lemotech-platform'
        package: '$(Build.ArtifactStagingDirectory)/frontend-$(Build.BuildId).zip'
        runtimeStack: 'NODE|20-lts'
        startUpCommand: 'node server.js'
        deploymentMethod: 'auto'
        appSettings: '-NODE_ENV $(environmentName) -FRONTEND_URL $(frontendUrl) -BACKEND_URL $(backendUrl) -WEBSITE_NODE_DEFAULT_VERSION ~20 -WEBSITE_HTTPLOGGING_RETENTION_DAYS 3'
      displayName: 'Deploy Frontend to Azure App Service'
      continueOnError: true

    - script: |
        echo "=== CHECKING DEPLOYMENT STATUS ==="
        if [ "$AGENT_JOBSTATUS" != "Succeeded" ]; then
          echo "ZIP deployment failed, attempting alternative deployment via Kudu API..."
          
          # Extract ZIP and deploy via Kudu API
          cd "$(Build.ArtifactStagingDirectory)"
          mkdir -p manual-deploy
          unzip -q frontend-$(Build.BuildId).zip -d manual-deploy
          
          echo "Files to deploy manually:"
          find manual-deploy -type f | wc -l
          
          # Get publishing credentials
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group lemotech-platform --name lemotech-frontend --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Deploy files via Kudu API
          echo "Deploying files via Kudu API..."
          cd manual-deploy
          find . -type f -exec curl -T {} "https://lemotech-frontend.scm.azurewebsites.net/api/vfs/site/wwwroot/{}" -u "$USERNAME:$PASSWORD" \;
          
          echo "✅ Manual deployment completed"
        else
          echo "✅ ZIP deployment succeeded"
        fi
      displayName: 'Fallback Manual Deployment if ZIP Deploy Failed'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Post-Deployment Verification ==="
          RG='lemotech-platform'
          APP='lemotech-frontend'
          
          # Check deployment status
          echo "App Service deployment status:"
          az webapp show --resource-group "$RG" --name "$APP" --query "{state:state,defaultHostName:defaultHostName,httpsOnly:httpsOnly}" --output table
          
          # Check startup command
          echo "Startup command:"
          az webapp config show --resource-group "$RG" --name "$APP" --query "appCommandLine" --output tsv
          
          # Check if server.js exists
          echo "Checking if server.js exists in deployment:"
          az webapp ssh --resource-group "$RG" --name "$APP" --command "ls -la /home/site/wwwroot/" || echo "Could not check files"
          
          echo "✅ Post-deployment verification complete"
      displayName: 'Verify Frontend Deployment'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Configuring Frontend App Service Settings ==="
          RG='lemotech-platform'
          APP='lemotech-frontend'
          
          # Set performance and timeout settings
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "$APP" \
            --settings \
              SCM_COMMAND_IDLE_TIMEOUT=1200 \
              WEBJOBS_IDLE_TIMEOUT=1200 \
              WEBSITE_TIME_ZONE="UTC" \
              WEBSITE_HTTPLOGGING_RETENTION_DAYS=3 \
              WEBSITE_NODE_DEFAULT_VERSION="~20" \
              NODE_ENV="$(environmentName)" \
              FRONTEND_URL="$(frontendUrl)" \
              BACKEND_URL="$(backendUrl)"
          
          echo "✅ Frontend app settings configured"
          
          # Start the app
          echo "Starting $APP..."
          az webapp start --resource-group "$RG" --name "$APP"
          echo "✅ Frontend app restarted"
      displayName: 'Configure Frontend App Settings & Start'

    - script: |
        echo "=== Frontend Health Check ==="
        echo "Checking frontend health at: $(deploymentUrl)"
        echo "Environment: $(environmentName)"
        
        # Check App Service status first
        echo "=== Checking App Service Status ==="
        az webapp show --name lemotech-frontend --resource-group lemotech-platform --query "{state:state,hostNames:hostNames}" --output table
        
        # Check if the default Azure URL works first
        DEFAULT_URL="https://lemotech-frontend-avbgchgjexfdbpa7.southafricanorth-01.azurewebsites.net/"
        echo "=== Testing default Azure URL: $DEFAULT_URL ==="
        curl -I "$DEFAULT_URL" || echo "Default URL not responding"
        
        # Check app logs for errors
        echo "=== Recent App Service Logs ==="
        az webapp log tail --name lemotech-frontend --resource-group lemotech-platform --provider application --timeout 30 || echo "Could not fetch logs"
        
        sleep 60
        
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          
          # Try both URLs
          echo "Testing custom domain: $(deploymentUrl)"
          if curl -f -s -I "$(deploymentUrl)" 2>/dev/null; then
            echo "✅ Frontend is healthy on custom domain!"
            echo "Frontend successfully deployed to: $(deploymentUrl)"
            break
          fi
          
          echo "Testing default URL: $DEFAULT_URL"
          if curl -f -s -I "$DEFAULT_URL" 2>/dev/null; then
            echo "✅ Frontend is healthy on default URL!"
            echo "⚠️ Custom domain $(deploymentUrl) may have DNS/SSL issues"
            break
          fi
          
          if [ $i -eq 10 ]; then
            echo "❌ Frontend health check failed for both URLs"
            echo "Custom domain: $(deploymentUrl)"
            echo "Default URL: $DEFAULT_URL"
            
            # Final diagnostic
            echo "=== Final Diagnostic ==="
            az webapp show --name lemotech-frontend --resource-group lemotech-platform --query "{state:state,defaultHostName:defaultHostName,hostNames:hostNames,httpsOnly:httpsOnly}" --output table
          else
            echo "Frontend not ready, waiting 30 seconds..."
            sleep 30
          fi
        done
      displayName: 'Verify Frontend Health'

  # Admin Dashboard Deployment
  - job: DeployAdmin
    displayName: 'Deploy Admin Dashboard'
    condition: eq(variables.deployAdmin, 'true')
    dependsOn: DeployFrontend
    variables:
      deploymentUrl: '$(adminUrl)'
    steps:
    - script: |
        echo "=== Ensuring Docker is available for deployment ==="
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          sudo apt-get update -q
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $(whoami)
          echo "✅ Docker installed: $(docker --version)"
        else
          echo "✅ Docker already available: $(docker --version)"
        fi
      displayName: 'Ensure Docker Available'
    - script: |
        echo "Fixing workspace permissions before checkout..."
        sudo chown -R $(whoami):$(whoami) /home/azureagent/myagent/_work || echo "workspace ownership fix done"
        sudo chmod -R u+rwX /home/azureagent/myagent/_work || echo "workspace permissions fix done"
      displayName: "Fix permissions before checkout"
    
    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'
    
    - script: |
        echo "Ensuring proper ownership after checkout..."
        sudo chown -R $(whoami):$(whoami) . || echo "ownership fix done"
      displayName: 'Fix Repository Ownership'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | admin-dashboard/package.json | admin-dashboard/package-lock.json'
        path: admin-dashboard/node_modules
        restoreKeys: |
          npm | "$(Agent.OS)"
      displayName: 'Cache admin-dashboard node_modules'
    
    - script: |
        echo "=== Admin Dashboard: Clean & Build ==="
        cd admin-dashboard
        pwd
        echo "Node $(node --version) NPM $(npm --version)"
        
        echo "Step 1: Create $(environmentName) environment..."
        # Create environment file based on deployment target
        cat > .env << EOF
        VITE_API_BASE_URL=$(adminUrl)
        VITE_ENVIRONMENT=$(environmentName)
        VITE_APP_TITLE=LemoTech Admin Dashboard
        VITE_REQUIRE_AUTH=true
        EOF
        
        echo "Admin will connect to: $(adminUrl)"
        
        # Debug environment before npm install
        echo "=== PRE-INSTALL DEBUG ==="
        echo "Current directory: $(pwd)"
        echo "User: $(whoami)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "NPM config:"
        npm config list
        echo "Directory contents:"
        ls -la
        echo "=== END PRE-INSTALL DEBUG ==="

        export NPM_CONFIG_PRODUCTION=false
        echo "NPM_CONFIG_PRODUCTION=$NPM_CONFIG_PRODUCTION"

        echo "Checking for package-lock.json..."
        ls -la package*.json || echo "No package files found"
        
        if [ -f package-lock.json ]; then
          echo "✅ Using package-lock.json -> npm ci"
          echo "Running: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm"
          npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm ci failed, likely package-lock.json out of sync. Falling back to npm install..."
            echo "=== NPM CI OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
            npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
              echo "❌ npm install also failed with exit code: $?"
              echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
            exit 1
            }
          }
        else
          echo "⚠️  No package-lock.json; falling back to npm install"
          echo "Running: npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm"
          npm install --legacy-peer-deps --no-audit --progress=false --unsafe-perm 2>&1 | tee npm-install.log || {
            echo "❌ npm install failed with exit code: $?"
            echo "=== NPM INSTALL OUTPUT ==="
            cat npm-install.log || echo "No npm-install.log"
            echo "=== NPM LOGS ==="
            find ~ -name "*.log" -path "*/.npm*" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || echo "No npm logs found"
            echo "=== DIRECTORY AFTER FAILED INSTALL ==="
            ls -la
          exit 1
        }
        fi
        
        echo "=== POST-INSTALL DEBUG ==="
        echo "✅ npm install completed, checking results..."
        echo "npm-install.log contents:"
        cat npm-install.log || echo "No npm-install.log found"
        echo ""
        echo "Directory contents after install:"
        ls -la
        echo "node_modules contents:"
        ls -la node_modules/ | head -20 || echo "No node_modules directory"
        echo "node_modules/.bin contents:"
        ls -la node_modules/.bin | head -10 || echo "No .bin directory"
        echo "=== END POST-INSTALL DEBUG ==="

        # Ensure all dev dependencies are properly installed
        echo "=== Ensuring dev dependencies are installed ==="
        export NPM_CONFIG_PRODUCTION=false
        npm install --include=dev --legacy-peer-deps --unsafe-perm || {
          echo "Dev dependencies install failed, trying alternative approach..."
          npm install --legacy-peer-deps --unsafe-perm
        }
        
        # Check if vite is available
        echo "=== Checking Vite availability ==="
        if ! npx vite --version >/dev/null 2>&1; then
          echo "Vite not found, installing explicitly..."
          npm install vite @vitejs/plugin-react --save-dev --legacy-peer-deps --unsafe-perm
        fi
        
        echo "Vite version:"
        npx vite --version || echo "Vite still not available"
        
        echo "Node modules .bin contents:"
        ls -la node_modules/.bin/ | grep vite || echo "No vite in .bin"

        # Build using npx to ensure we find vite
        echo "=== Building with npx vite build ==="
        npx vite build || {
          echo "npx vite build failed, trying npm run build..."
          npm run build
        }

        if [ -d "dist" ]; then
          echo "✅ Admin build successful"
        else
          echo "❌ Admin build failed: dist missing"
          ls -la
          exit 1
        fi
        
        echo "Step 4: Verify build output..."
        echo "Checking for dist directory..."
        if [ -d "dist" ]; then
          echo "✅ Admin dashboard build successful!"
          echo "=== COMPLETE ADMIN DIST CONTENTS ==="
          find dist -type f | sort
          echo "=== ADMIN DIST DIRECTORY STRUCTURE ==="
          ls -la dist/
          if [ -d "dist/assets" ]; then
            echo "Admin assets directory: $(find dist/assets -type f | wc -l) files"
          fi
          if [ -d "dist/icons" ]; then
            echo "Admin icons directory: $(find dist/icons -type f | wc -l) files"
            ls -la dist/icons/
          else
            echo "ℹ️ Admin has no icons directory in dist (expected - admin has fewer files)"
          fi
          
          # Check for admin-specific expected files
          EXPECTED_ADMIN_DIST_FILES=("index.html" "vite.svg")
          for file in "${EXPECTED_ADMIN_DIST_FILES[@]}"; do
            if [ -f "dist/$file" ]; then
              echo "✅ Found in admin dist: $file"
            else
              echo "⚠️ Missing from admin dist: $file"
            fi
          done
          
          echo "Total admin dist files: $(find dist/ -type f | wc -l)"
        else
          echo "❌ Admin dashboard build failed!"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
        
        echo "Step 5: Create clean deployment package..."
        cd dist
        
        # Create admin dist zip
        zip -r ../admin-dist.zip . -x "*.map"
        cd ..
        
        echo "✅ Admin dashboard deployment package ready!"
      displayName: 'Build Admin Dashboard (robust)'
    
    - script: |
        echo "Step 2: Prepare Admin App Service deployment package..."
        cd admin-dashboard
        rm -rf ../deploy-admin || true
        mkdir -p ../deploy-admin
        
        # Copy all dist files to deployment directory (including hidden files)
        echo "=== DEBUG: Files in admin dist before copy ==="
        find dist -type f -name "*" | head -20
        echo "=== DEBUG: Hidden files in admin dist ==="
        find dist -name ".*" -type f
        echo "=== DEBUG: All files in admin dist ==="
        ls -la dist/
        echo "=== DEBUG: Files in admin public directory ==="
        ls -la public/
        echo "=== DEBUG: What did admin build actually generate in dist? ==="
        find dist -type f -name "*" | sort
        echo "=== DEBUG: Admin dist directory structure ==="
        ls -la dist/
        if [ -d "dist/icons" ]; then
          echo "=== DEBUG: Admin dist has icons directory ==="
          ls -la dist/icons/
        else
          echo "=== DEBUG: Admin dist does NOT have icons directory ==="
        fi
        
        # PHASE 1: Copy all admin dist files (built files) with verification
        echo "=== COPYING ALL ADMIN DIST FILES ==="
        echo "Source admin dist files:"
        find dist -type f | wc -l
        
        cp -r dist/. ../deploy-admin/
        
        echo "After copying admin dist, deploy-admin contains:"
        find ../deploy-admin -type f | wc -l
        
        # PHASE 2: Verify all expected admin dist files are present
        echo "=== Verifying expected admin dist files ==="
        EXPECTED_ADMIN_DIST=(
          "assets"
          "index.html"
          "lemotech-logo.png"
          "vite.svg"
        )
        
        MISSING_ADMIN_FILES=()
        for item in "${EXPECTED_ADMIN_DIST[@]}"; do
          if [ -e "../deploy-admin/$item" ]; then
            echo "✅ Found expected admin: $item"
          else
            echo "❌ Missing expected admin: $item"
            MISSING_ADMIN_FILES+=("$item")
          fi
        done
        
        # PHASE 3: Force copy missing admin files from public if they exist
        if [ ${#MISSING_ADMIN_FILES[@]} -gt 0 ]; then
          echo "=== FORCE COPYING MISSING ADMIN FILES FROM PUBLIC ==="
          for item in "${MISSING_ADMIN_FILES[@]}"; do
            if [ -e "public/$item" ]; then
              echo "🔄 Force copying missing admin $item from public..."
              if [ -d "public/$item" ]; then
                mkdir -p "../deploy-admin/$item"
                cp -r "public/$item/." "../deploy-admin/$item/"
              else
                cp "public/$item" "../deploy-admin/$item"
              fi
              
              # Verify the admin copy worked
              if [ -e "../deploy-admin/$item" ]; then
                echo "✅ Successfully copied admin $item from public"
              else
                echo "❌ Failed to copy admin $item from public"
              fi
            else
              echo "ℹ️ Admin $item not found in public directory (this may be normal for admin)"
            fi
          done
        fi
        
        # Force copy ALL public files to ensure nothing is missing
        echo "=== Force copying ALL admin public files ==="
        
        # Admin should only use its own built dist files and public files
        # Check what files exist in admin's own public directory
        ADMIN_PUBLIC_FILES=(
          "vite.svg"
          "lemotech-logo.png"
        )
        
        # Check if admin has additional public files that should be copied
        POTENTIAL_ADMIN_FILES=(
          "icons/android-chrome-192x192.png"
          "icons/android-chrome-512x512.png" 
          "icons/apple-touch-icon.png"
          "icons/favicon-16x16.png"
          "icons/favicon-32x32.png"
          "icons/favicon.ico"
          "icons/mstile-144x144.png"
          ".htaccess"
          "browserconfig.xml"
          "manifest.json"
          "sw.js"
        )
        
        # Ensure icons directory exists
        mkdir -p ../deploy-admin/icons
        
        # Copy admin's own public files only
        echo "=== Copying admin's own public files ==="
        for file in "${ADMIN_PUBLIC_FILES[@]}"; do
          if [ -f "public/$file" ]; then
            echo "✅ Copying admin's own $file..."
            cp "public/$file" "../deploy-admin/$file" || echo "❌ Failed to copy admin $file"
            if [ -f "../deploy-admin/$file" ]; then
              echo "   ✓ Confirmed: admin $file exists in deployment"
            else
              echo "   ✗ Missing: admin $file not found after copy"
            fi
          else
            echo "⚠️  Source missing: admin public/$file not found"
          fi
        done
        
        # Check if admin has any additional files that should be copied
        echo "=== Checking for additional admin public files ==="
        for file in "${POTENTIAL_ADMIN_FILES[@]}"; do
          if [ -f "public/$file" ]; then
            echo "✅ Found additional admin file: $file - copying..."
            cp "public/$file" "../deploy-admin/$file" || echo "❌ Failed to copy additional admin $file"
            if [ -f "../deploy-admin/$file" ]; then
              echo "   ✓ Confirmed: additional admin $file exists in deployment"
            else
              echo "   ✗ Missing: additional admin $file not found after copy"
            fi
          else
            echo "ℹ️  Admin doesn't have: public/$file (this is normal)"
          fi
        done
        
        # Copy any additional public assets that might exist
        if [ -d "public/assets" ]; then
          echo "=== Copying additional admin public assets ==="
          mkdir -p ../deploy-admin/assets
          cp -r public/assets/* ../deploy-admin/assets/ 2>/dev/null || echo "No additional admin assets found"
        fi
        
        echo "=== DEBUG: Final files in deploy-admin ==="
        find ../deploy-admin -type f -name "*" | head -30
        echo "=== DEBUG: Hidden files in deploy-admin ==="
        find ../deploy-admin -name ".*" -type f
        echo "=== DEBUG: Directory structure ==="
        ls -la ../deploy-admin/
        
        echo "=== FINAL VERIFICATION: What will be deployed to Azure Admin ==="
        echo "Total files: $(find ../deploy-admin -type f | wc -l)"
        echo "Directory structure:"
        find ../deploy-admin -type d | sort
        echo "All files being deployed:"
        find ../deploy-admin -type f | sort
        
        
        # Create minimal Node.js server for admin SPA serving
        cat > ../deploy-admin/server.js << 'EOF'
        // Minimal Node.js server for Admin SPA with security headers
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        const port = process.env.PORT || 8080;
        const root = path.resolve(__dirname);
        
        const mimeTypes = {
          '.html': 'text/html',
          '.js': 'application/javascript',
          '.css': 'text/css',
          '.json': 'application/json',
          '.png': 'image/png',
          '.jpg': 'image/jpeg',
          '.jpeg': 'image/jpeg',
          '.gif': 'image/gif',
          '.svg': 'image/svg+xml',
          '.ico': 'image/x-icon',
          '.woff': 'font/woff',
          '.woff2': 'font/woff2',
          '.ttf': 'font/ttf',
          '.eot': 'application/vnd.ms-fontobject'
        };
        
        function sendFile(res, filePath) {
          fs.readFile(filePath, (err, data) => {
            if (err) {
              console.error('Error reading file:', err);
              res.writeHead(500, {'Content-Type': 'text/plain'});
              res.end('Internal Server Error');
              return;
            }
            
            const ext = path.extname(filePath).toLowerCase();
            const contentType = mimeTypes[ext] || 'application/octet-stream';
            
            // Security headers for admin dashboard
            const headers = {
              'Content-Type': contentType,
              'Cache-Control': ext === '.html' ? 'no-cache' : 'public, max-age=31536000',
              'X-Frame-Options': 'DENY',
              'X-Content-Type-Options': 'nosniff',
              'Strict-Transport-Security': 'max-age=31536000',
              'X-XSS-Protection': '1; mode=block',
              'Referrer-Policy': 'strict-origin-when-cross-origin'
            };
            
            res.writeHead(200, headers);
            res.end(data);
          });
        }
        
        const server = http.createServer((req, res) => {
          try {
            let reqPath = decodeURI(req.url.split('?')[0]);
            if (reqPath === '/') reqPath = '/index.html';
            
            const filePath = path.join(root, reqPath);
            
            fs.stat(filePath, (err, stats) => {
              if (err || !stats.isFile()) {
                // SPA fallback - serve index.html for client-side routing
                const indexPath = path.join(root, 'index.html');
                sendFile(res, indexPath);
              } else {
                sendFile(res, filePath);
              }
            });
          } catch (error) {
            console.error('Server error:', error);
            res.writeHead(500, {'Content-Type': 'text/plain'});
            res.end('Internal Server Error');
          }
        });
        
        server.listen(port, () => {
          console.log('Admin Dashboard SPA Server listening on port', port);
          console.log('Environment:', process.env.NODE_ENV || 'development');
          console.log('Security headers enabled for admin protection');
        });
        
        process.on('SIGTERM', () => {
          console.log('SIGTERM received, shutting down gracefully');
          server.close(() => process.exit(0));
        });
        EOF

        # Create package.json for the admin SPA server
        cat > ../deploy-admin/package.json << 'EOF'
        {
          "name": "lemotech-admin-spa",
          "version": "1.0.0",
          "description": "LemoTech Admin Dashboard SPA Server",
          "main": "server.js",
          "scripts": {
            "start": "node server.js"
          },
          "engines": {
            "node": ">=18.0.0"
          }
        }
        EOF

        echo "✅ Admin Dashboard App Service deployment package ready!"
        ls -la ../deploy-admin/
        
        echo "=== PRE-ARCHIVE VERIFICATION: Admin deploy directory ==="
        echo "Total files in deploy-admin: $(find ../deploy-admin -type f | wc -l)"
        echo "All files that will be archived:"
        find ../deploy-admin -type f | sort
        echo "Directory sizes:"
        du -sh ../deploy-admin/*
      displayName: 'Prepare Admin App Service Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-admin'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/admin-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive Admin Dashboard Package'

    - script: |
        echo "=== VERIFYING ADMIN ZIP CONTENTS ==="
        cd "$(Build.ArtifactStagingDirectory)"
        echo "ZIP file size: $(ls -lh admin-$(Build.BuildId).zip)"
        echo "ZIP contents:"
        unzip -l admin-$(Build.BuildId).zip | head -50
        echo "=== END ZIP VERIFICATION ==="
      displayName: 'Verify Admin ZIP Contents'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Cleaning Admin App Service for Clean Deployment ==="
          RG='lemotech-platform'
          APP='lemotech-admin'
          
          # Stop the app first
          echo "Stopping $APP..."
          az webapp stop --resource-group "$RG" --name "$APP"
          echo "✅ App stopped for clean deployment"
          
          # Clean wwwroot via Kudu API
          echo "Cleaning /site/wwwroot/ completely..."
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group $RG --name $APP --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Clean wwwroot via Kudu REST API
          curl -X DELETE "https://$APP.scm.azurewebsites.net/api/vfs/site/wwwroot/" \
            -u "$USERNAME:$PASSWORD" \
            -H "If-Match: *" || echo "Clean attempt via API completed"
          
          echo "✅ wwwroot cleaned - ready for clean admin deployment"
      displayName: 'Clean Admin App Service wwwroot'

    - script: |
        echo "=== PRE-DEPLOYMENT ADMIN ZIP VERIFICATION ==="
        cd "$(Build.ArtifactStagingDirectory)"
        echo "Admin ZIP file exists: $(ls -la admin-$(Build.BuildId).zip)"
        echo "Admin ZIP file size: $(du -h admin-$(Build.BuildId).zip)"
        echo "Extracting admin ZIP to verify contents..."
        mkdir -p temp-extract-admin
        unzip -q admin-$(Build.BuildId).zip -d temp-extract-admin
        echo "Extracted admin contents:"
        find temp-extract-admin -type f | sort
        echo "Total extracted admin files: $(find temp-extract-admin -type f | wc -l)"
        rm -rf temp-extract-admin
      displayName: 'Pre-Deployment Admin ZIP Verification'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'lemotech-admin'
        resourceGroupName: 'lemotech-platform'
        package: '$(Build.ArtifactStagingDirectory)/admin-$(Build.BuildId).zip'
        runtimeStack: 'NODE|20-lts'
        startUpCommand: 'node server.js'
        deploymentMethod: 'auto'
        appSettings: '-NODE_ENV $(environmentName) -ADMIN_URL $(adminUrl) -BACKEND_URL $(backendUrl) -WEBSITE_NODE_DEFAULT_VERSION ~20 -WEBSITE_HTTPLOGGING_RETENTION_DAYS 3'
      displayName: 'Deploy Admin Dashboard to Azure App Service'
      continueOnError: true

    - script: |
        echo "=== CHECKING ADMIN DEPLOYMENT STATUS ==="
        if [ "$AGENT_JOBSTATUS" != "Succeeded" ]; then
          echo "Admin ZIP deployment failed, attempting alternative deployment via Kudu API..."
          
          # Extract ZIP and deploy via Kudu API
          cd "$(Build.ArtifactStagingDirectory)"
          mkdir -p manual-deploy-admin
          unzip -q admin-$(Build.BuildId).zip -d manual-deploy-admin
          
          echo "Admin files to deploy manually:"
          find manual-deploy-admin -type f | wc -l
          
          # Get publishing credentials
          CREDS=$(az webapp deployment list-publishing-profiles --resource-group lemotech-platform --name lemotech-admin --query "[?publishMethod=='FTP'].{username:userName,password:userPWD}" --output tsv)
          USERNAME=$(echo $CREDS | cut -f1)
          PASSWORD=$(echo $CREDS | cut -f2)
          
          # Deploy files via Kudu API
          echo "Deploying admin files via Kudu API..."
          cd manual-deploy-admin
          find . -type f -exec curl -T {} "https://lemotech-admin.scm.azurewebsites.net/api/vfs/site/wwwroot/{}" -u "$USERNAME:$PASSWORD" \;
          
          echo "✅ Manual admin deployment completed"
        else
          echo "✅ Admin ZIP deployment succeeded"
        fi
      displayName: 'Fallback Manual Admin Deployment if ZIP Deploy Failed'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Configuring Admin App Service Settings ==="
          RG='lemotech-platform'
          APP='lemotech-admin'
          
          # Set performance and timeout settings
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "$APP" \
            --settings \
              SCM_COMMAND_IDLE_TIMEOUT=1200 \
              WEBJOBS_IDLE_TIMEOUT=1200 \
              WEBSITE_TIME_ZONE="UTC" \
              WEBSITE_HTTPLOGGING_RETENTION_DAYS=3 \
              WEBSITE_NODE_DEFAULT_VERSION="~20" \
              NODE_ENV="$(environmentName)" \
              ADMIN_URL="$(adminUrl)" \
              BACKEND_URL="$(backendUrl)"
          
          echo "✅ Admin app settings configured"
          
          # Start the app
          echo "Starting $APP..."
          az webapp start --resource-group "$RG" --name "$APP"
          echo "✅ Admin app restarted"
      displayName: 'Configure Admin App Settings & Start'

    - script: |
        echo "=== Admin Dashboard Health Check ==="
        echo "Checking admin dashboard health at: $(deploymentUrl)"
        echo "Environment: $(environmentName)"
        
        # Check App Service status first
        echo "=== Checking Admin App Service Status ==="
        az webapp show --name lemotech-admin --resource-group lemotech-platform --query "{state:state,hostNames:hostNames}" --output table
        
        # Check if the default Azure URL works first
        DEFAULT_URL="lemotech-admin-aya0hbfgc2dbh8c0.southafricanorth-01.azurewebsites.net"
        echo "=== Testing default Azure URL: $DEFAULT_URL ==="
        curl -I "$DEFAULT_URL" || echo "Default URL not responding"
        
        # Check app logs for errors
        echo "=== Recent Admin App Service Logs ==="
        az webapp log tail --name lemotech-admin --resource-group lemotech-platform --provider application --timeout 30 || echo "Could not fetch logs"
        
        sleep 60
        
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          
          # Try both URLs
          echo "Testing custom domain: $(deploymentUrl)"
          if curl -f -s -I "$(deploymentUrl)" 2>/dev/null; then
            echo "✅ Admin Dashboard is healthy on custom domain!"
            echo "Admin Dashboard successfully deployed to: $(deploymentUrl)"
            break
          fi
          
          echo "Testing default URL: $DEFAULT_URL"
          if curl -f -s -I "$DEFAULT_URL" 2>/dev/null; then
            echo "✅ Admin Dashboard is healthy on default URL!"
            echo "⚠️ Custom domain $(deploymentUrl) may have DNS/SSL issues"
            break
          fi
          
          if [ $i -eq 10 ]; then
            echo "❌ Admin Dashboard health check failed for both URLs"
            echo "Custom domain: $(deploymentUrl)"
            echo "Default URL: $DEFAULT_URL"
            
            # Final diagnostic
            echo "=== Final Diagnostic ==="
            az webapp show --name lemotech-admin --resource-group lemotech-platform --query "{state:state,defaultHostName:defaultHostName,hostNames:hostNames,httpsOnly:httpsOnly}" --output table
          else
            echo "Admin Dashboard not ready, waiting 30 seconds..."
            sleep 30
          fi
        done
      displayName: 'Verify Admin Dashboard Health'

- stage: DeploymentSummary
  displayName: 'Deployment Summary'
  dependsOn: DeployApplications
  condition: always()
  jobs:
  - job: Summary
    displayName: 'Generate Summary'
    steps:
    - script: |
        echo "=== 🚀 LemoTech Deployment Complete! ==="
        echo ""
        echo "Build: $(Build.BuildNumber)"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo ""
        echo "🌐 Application URLs (All App Services):"
        echo "Backend API: $(backendUrl)"
        echo "Frontend App: $(frontendUrl)"
        echo "Admin Dashboard: $(adminUrl)"
        echo ""
        echo "✅ Deployment completed successfully!"
      displayName: 'Display Summary'

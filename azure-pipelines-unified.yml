# LemoTech Unified Deployment Pipeline
# Intelligent deployment that detects changes and deploys only what's needed

trigger:
  branches:
    include:
    - master
    - main
  paths:
    exclude:
    - docs/*
    - README.md
    - "*.md"

pool:
  name: 'Default'

variables:
  - group: LemoTech-Production-Variables
  - name: nodeVersion
    value: '20.x'
  - name: environmentName
    value: 'production'

stages:
- stage: DetectChanges
  displayName: 'Detect Changes and Plan Deployment'
  jobs:
  - job: AnalyzeChanges
    displayName: 'Analyze Changed Files'
    steps:
    - checkout: self
      fetchDepth: 2
      displayName: 'Checkout with History'
    
    - script: |
        echo "=== LemoTech Intelligent Deployment System ==="
        echo "Analyzing changes to determine deployment strategy..."
        echo ""
        
        # Get changed files between this commit and the previous one
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          echo "Pull Request detected, comparing with target branch..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          echo "Direct push detected, comparing with previous commit..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        echo ""
        
        # Initialize deployment flags
        DEPLOY_BACKEND=false
        DEPLOY_FRONTEND=false
        DEPLOY_ADMIN=false
        
        # Check for backend changes
        if echo "$CHANGED_FILES" | grep -E "^(backend/|src/|\.deployment|azure-pipelines-backend\.yml|package\.json)" > /dev/null; then
          echo "🔄 Backend changes detected!"
          DEPLOY_BACKEND=true
        fi
        
        # Check for frontend changes
        if echo "$CHANGED_FILES" | grep -E "^(frontend/|azure-pipelines-frontend\.yml)" > /dev/null; then
          echo "🔄 Frontend changes detected!"
          DEPLOY_FRONTEND=true
        fi
        
        # Check for admin dashboard changes
        if echo "$CHANGED_FILES" | grep -E "^(admin-dashboard/|azure-pipelines-admin\.yml)" > /dev/null; then
          echo "🔄 Admin dashboard changes detected!"
          DEPLOY_ADMIN=true
        fi
        
        # Check for template changes (affects all)
        if echo "$CHANGED_FILES" | grep -E "^templates/" > /dev/null; then
          echo "🔄 Template changes detected - will deploy all applications!"
          DEPLOY_BACKEND=true
          DEPLOY_FRONTEND=true
          DEPLOY_ADMIN=true
        fi
        
        # Force deploy all if no specific changes detected (safety)
        if [ "$DEPLOY_BACKEND" = false ] && [ "$DEPLOY_FRONTEND" = false ] && [ "$DEPLOY_ADMIN" = false ]; then
          echo "🔄 No specific changes detected - deploying all for safety!"
          DEPLOY_BACKEND=true
          DEPLOY_FRONTEND=true
          DEPLOY_ADMIN=true
        fi
        
        echo ""
        echo "=== Deployment Plan ==="
        echo "Backend API: $DEPLOY_BACKEND"
        echo "Frontend App: $DEPLOY_FRONTEND"
        echo "Admin Dashboard: $DEPLOY_ADMIN"
        echo ""
        
        # Set pipeline variables
        echo "##vso[task.setvariable variable=deployBackend;isOutput=true]$DEPLOY_BACKEND"
        echo "##vso[task.setvariable variable=deployFrontend;isOutput=true]$DEPLOY_FRONTEND"
        echo "##vso[task.setvariable variable=deployAdmin;isOutput=true]$DEPLOY_ADMIN"
        
        echo "✅ Change analysis completed!"
      displayName: 'Analyze Changed Files'
      name: 'changes'

- stage: InstallDependencies
  displayName: 'Install Required Tools'
  dependsOn: DetectChanges
  jobs:
  - job: SetupAgent
    displayName: 'Setup Self-Hosted Agent'
    steps:
    - script: |
        echo "=== Agent Environment Setup ==="
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Name: $(Agent.Name)"
        echo "Working Directory: $(System.DefaultWorkingDirectory)"
        echo "Node.js Version Required: $(nodeVersion)"
        echo ""
        
        # Check current Node.js version
        if command -v node &> /dev/null; then
          echo "Current Node.js: $(node --version)"
        else
          echo "Node.js not found"
        fi
        
        # Check current npm version
        if command -v npm &> /dev/null; then
          echo "Current npm: $(npm --version)"
        else
          echo "npm not found"
        fi
      displayName: 'Check Agent Environment'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Azure CLI Installation for Self-Hosted Agent ==="
        
        # Check if Azure CLI is already available
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI already installed: $(az --version | head -1)"
          exit 0
        fi
        
        echo "Azure CLI not found, installing via pip..."
        
        # Install Azure CLI via pip (most reliable method)
        if command -v dnf &> /dev/null; then
          sudo dnf install -y python3-pip
        elif command -v apt-get &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y python3-pip
        elif command -v yum &> /dev/null; then
          sudo yum install -y python3-pip
        fi
        
        # Install Azure CLI
        pip3 install azure-cli
        
        # Add to PATH
        export PATH="$HOME/.local/bin:$PATH"
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
        
        # Verify installation
        if command -v az &> /dev/null; then
          echo "✅ Azure CLI successfully installed!"
          echo "Version: $(az --version | head -1)"
        else
          echo "❌ Azure CLI installation failed"
          echo "Continuing without Azure CLI - using simplified deployment"
        fi
        
        echo "✅ Agent setup completed!"
      displayName: 'Install Azure CLI'

- stage: DeployApplications
  displayName: 'Deploy Applications'
  dependsOn: 
    - DetectChanges
    - InstallDependencies
  variables:
    deployBackend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployBackend'] ]
    deployFrontend: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployFrontend'] ]
    deployAdmin: $[ stageDependencies.DetectChanges.AnalyzeChanges.outputs['changes.deployAdmin'] ]
  jobs:
  # Backend Deployment
  - job: DeployBackend
    displayName: 'Deploy Backend API'
    condition: eq(variables.deployBackend, 'true')
    steps:
    - checkout: self
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Backend API Deployment ==="
        cd backend
        echo "Current directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
        echo "Installing dependencies..."
        npm install --legacy-peer-deps
        
        echo "Running TypeScript build..."
        npx tsc -p tsconfig.prod.json
        
        echo "Running database migrations..."
        node scripts/migrate.js migrate --force
        
        echo "Verifying build output..."
        if [ -d "dist" ]; then
          echo "✅ Build successful - dist directory created"
          ls -la dist/
        else
          echo "❌ Build failed - dist directory not found"
          exit 1
        fi
      displayName: 'Build Backend'
    
    - script: |
        echo "=== Creating Deployment Package ==="
        mkdir -p deploy-package
        cd backend
        
        # Copy package.json and create clean version
        cp package.json ../deploy-package/
        cd ../deploy-package
        
        # Create clean package.json for deployment
        node -e "
          const fs = require('fs');
          const original = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const clean = {
            name: original.name,
            version: original.version,
            main: 'dist/app.js',
            scripts: {
              start: 'node dist/app.js'
            },
            engines: original.engines,
            dependencies: original.dependencies
          };
          fs.writeFileSync('package.json', JSON.stringify(clean, null, 2));
        "
        
        echo "Step 1: Copy BACKEND files to staging folder..."
        cd ../backend
        mkdir -p ../staging-backend
        
        # Copy ONLY backend source files (exclude node_modules, dist, etc.)
        cp package.json ../staging-backend/
        cp migrate.json ../staging-backend/ || echo "migrate.json not found"
        cp tsconfig.prod.json ../staging-backend/ || cp tsconfig.json ../staging-backend/
        cp -r src ../staging-backend/
        cp -r scripts ../staging-backend/ || echo "scripts not found"
        [ -f web.config ] && cp web.config ../staging-backend/
        
        echo "Step 2: Install dependencies and build in staging folder..."
        cd ../staging-backend
        npm install --legacy-peer-deps
        npm run build
        
        echo "Step 3: Run migrations to ensure database is ready..."
        node scripts/migrate.js migrate --force || echo "Migrations completed or already applied"
        
        echo "Step 4: Clean and create final deployment package for wwwroot..."
        cd ..
        
        # Clean any existing deployment package
        rm -rf deploy-package
        mkdir -p deploy-package
        cd deploy-package
        
        echo "Copying ONLY built files and runtime necessities (NO node_modules, NO frontend/admin files)..."
        # Copy built application
        cp -r ../staging-backend/dist ./
        
        # Copy runtime migration files
        mkdir -p ./src/infrastructure
        cp -r ../staging-backend/src/infrastructure/migrations ./src/infrastructure/
        
        # Copy runtime configuration and scripts
        cp ../staging-backend/migrate.json ./
        cp -r ../staging-backend/scripts ./
        cp ../staging-backend/package.json ./
        [ -f ../staging-backend/web.config ] && cp ../staging-backend/web.config ./
        
        echo "Step 5: Install fresh production dependencies for deployment..."
        npm install --production --legacy-peer-deps
        
        echo "Step 6: Creating deployment configuration..."
        # Create deployment configuration  
        echo "[config]" > .deployment
        echo "command = node dist/app.js" >> .deployment
        
        # Copy web.config if exists
        [ -f ../backend/web.config ] && cp ../backend/web.config ./
        
        echo "Step 7: Verify deployment package (BACKEND ONLY)..."
        echo "=== Deployment Package Contents ==="
        echo "Main files:"
        ls -la
        echo ""
        echo "Dist folder contents:"
        ls -la dist/ | head -10
        echo ""
        echo "Checking for unwanted files (should be empty):"
        echo "Frontend files:" $(find . -name "*frontend*" -o -name "*admin*" 2>/dev/null | wc -l)
        echo "Source TS files:" $(find . -name "*.ts" -not -path "./node_modules/*" | wc -l)  
        echo ""
        echo "✅ BACKEND-ONLY deployment package verified!"
        
        echo "✅ Deployment package created!"
      displayName: 'Prepare Deployment Package'
    
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy-package'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive Backend Package'
    
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'LemoTech-Azure-Connection'
        appType: 'webAppLinux'
        appName: 'lemotech-api-backend'
        resourceGroupName: 'lemotech-platform'
        package: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        runtimeStack: 'NODE|20-lts'
        startUpCommand: 'node dist/app.js'
        deploymentMethod: 'zipDeploy'
        appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -ENABLE_ORYX_BUILD false -WEBSITE_DISABLE_SCM_BUILD true -WEBSITE_RUN_FROM_PACKAGE 0 -WEBSITE_DISABLE_DEPLOYMENT_BUILD true -NODE_ENV production -PORT 8000 -PAYFAST_MERCHANT_ID dummy -PAYFAST_MERCHANT_KEY dummy -PAYFAST_PASSPHRASE dummy -SCM_COMMAND_IDLE_TIMEOUT 1200 -WEBJOBS_IDLE_TIMEOUT 1200 -WEBSITE_NODE_DEFAULT_VERSION ~20 -WEBSITE_HTTPLOGGING_RETENTION_DAYS 3'
      displayName: 'Deploy to Azure App Service'
    
    - script: |
        echo "=== Backend Health Check ==="
        sleep 60
        
        BACKEND_URL="https://lemotech-api-backend.azurewebsites.net"
        
        for i in {1..10}; do
          echo "Health check attempt $i/10..."
          if curl -f -s -o /dev/null "$BACKEND_URL/health" 2>/dev/null; then
            echo "✅ Backend is healthy!"
            break
          elif [ $i -eq 10 ]; then
            echo "⚠️ Backend health check timeout"
          else
            sleep 30
          fi
        done
      displayName: 'Verify Backend Health'

  # Frontend Deployment
  - job: DeployFrontend
    displayName: 'Deploy Frontend App'
    condition: eq(variables.deployFrontend, 'true')
    dependsOn: DeployBackend
    steps:
    - checkout: self
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Frontend Application Deployment ==="
        cd frontend
        
        # Create environment file
        cat > .env << EOF
        VITE_API_BASE_URL=https://lemotech-api-backend.azurewebsites.net
        VITE_ENVIRONMENT=production
        VITE_APP_TITLE=LemoTech - On-Demand Cleaning
        NODE_ENV=production
        EOF
        
        echo "Installing dependencies..."
        npm ci
        
        echo "Building React application..."
        npm run build
        
        if [ -d "dist" ]; then
          echo "✅ Frontend build successful!"
          ls -la dist/
        else
          echo "❌ Frontend build failed!"
          exit 1
        fi
      displayName: 'Build Frontend'
    
    - task: AzureStaticWebApp@0
      inputs:
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
        app_location: '/frontend'
        output_location: 'dist'
        skip_app_build: true
      displayName: 'Deploy to Azure Static Web Apps'

  # Admin Dashboard Deployment
  - job: DeployAdmin
    displayName: 'Deploy Admin Dashboard'
    condition: eq(variables.deployAdmin, 'true')
    dependsOn: DeployFrontend
    steps:
    - checkout: self
      displayName: 'Checkout Source Code'
    
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js $(nodeVersion)'
    
    - script: |
        echo "=== Admin Dashboard Deployment ==="
        cd admin-dashboard
        
        # Create environment file
        cat > .env << EOF
        VITE_API_BASE_URL=https://lemotech-api-backend.azurewebsites.net
        VITE_ENVIRONMENT=production
        VITE_APP_TITLE=LemoTech Admin Dashboard
        VITE_REQUIRE_AUTH=true
        NODE_ENV=production
        EOF
        
        echo "Installing dependencies..."
        npm ci
        
        echo "Building admin dashboard..."
        npm run build
        
        if [ -d "dist" ]; then
          echo "✅ Admin dashboard build successful!"
          
          # Add security configuration
          cat > dist/staticwebapp.config.json << EOF
          {
            "routes": [
              {
                "route": "/*",
                "serve": "/index.html",
                "statusCode": 200,
                "allowedRoles": ["admin", "manager"]
              }
            ],
            "responseOverrides": {
              "401": {
                "redirect": "/login",
                "statusCode": 302
              }
            },
            "globalHeaders": {
              "X-Frame-Options": "DENY",
              "X-Content-Type-Options": "nosniff",
              "Strict-Transport-Security": "max-age=31536000"
            }
          }
          EOF
          
          ls -la dist/
        else
          echo "❌ Admin dashboard build failed!"
          exit 1
        fi
      displayName: 'Build Admin Dashboard'
    
    - task: AzureStaticWebApp@0
      inputs:
        azure_static_web_apps_api_token: '$(AZURE_ADMIN_STATIC_WEB_APPS_API_TOKEN)'
        app_location: '/admin-dashboard'
        output_location: 'dist'
        skip_app_build: true
      displayName: 'Deploy Admin to Azure Static Web Apps'

- stage: DeploymentSummary
  displayName: 'Deployment Summary'
  dependsOn: DeployApplications
  condition: always()
  jobs:
  - job: Summary
    displayName: 'Generate Summary'
    steps:
    - script: |
        echo "=== 🚀 LemoTech Deployment Complete! ==="
        echo ""
        echo "Build: $(Build.BuildNumber)"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo ""
        echo "🌐 Application URLs:"
        echo "Backend API: https://lemotech-api-backend.azurewebsites.net"
        echo "Frontend: Check Azure Static Web Apps for URL"
        echo "Admin: Check Azure Static Web Apps for URL"
        echo ""
        echo "✅ Deployment completed successfully!"
      displayName: 'Display Summary'

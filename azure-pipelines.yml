# Azure DevOps Pipeline for LemoTech Platform
# Deploy backend, frontend, and admin dashboard to Azure

trigger:
- main
- develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Build configuration
  buildConfiguration: 'Release'
  nodeVersion: '18.x'

  # Azure service connections (configure in Azure DevOps)
  azureServiceConnection: 'LemoTech-Azure-Connection'

  # Resource names
  resourceGroupName: 'lemotech-platform'
  backendAppName: 'lemotech-api-backend'
  frontendAppName: 'lemotech-frontend'
  adminAppName: 'lemotech-admin-dashboard'

stages:
- stage: Build
  displayName: 'Build Applications'
  jobs:
  - job: BuildBackend
    displayName: 'Build Backend API'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        cd backend
        npm ci
        npm run build
      displayName: 'npm install and build backend'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'backend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive backend files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
        ArtifactName: 'backend'
      displayName: 'Publish backend artifact'

  - job: BuildFrontend
    displayName: 'Build Frontend App'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: 'npm install and build frontend'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'frontend/dist'
        ArtifactName: 'frontend'
      displayName: 'Publish frontend artifact'

  - job: BuildAdmin
    displayName: 'Build Admin Dashboard'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        cd admin-dashboard
        npm ci
        npm run build
      displayName: 'npm install and build admin dashboard'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'admin-dashboard/dist'
        ArtifactName: 'admin'
      displayName: 'Publish admin artifact'

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployBackendDev
    displayName: 'Deploy Backend to Development'
    environment: 'lemotech-development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webAppLinux'
              appName: '$(backendAppName)-dev'
              package: '$(Pipeline.Workspace)/backend/backend-$(Build.BuildId).zip'
              runtimeStack: 'NODE|18-lts'
            displayName: 'Deploy Backend to Azure App Service'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployBackend
    displayName: 'Deploy Backend to Production'
    environment: 'lemotech-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webAppLinux'
              appName: $(backendAppName)
              package: '$(Pipeline.Workspace)/backend/backend-$(Build.BuildId).zip'
              runtimeStack: 'NODE|18-lts'
            displayName: 'Deploy Backend to Azure App Service'

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Running database migrations..."
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(backendAppName) \
                  --settings INIT_DB_ON_START=true

                echo "Restarting app to trigger migrations..."
                az webapp restart \
                  --resource-group $(resourceGroupName) \
                  --name $(backendAppName)
            displayName: 'Run Database Migrations'

  - deployment: DeployFrontend
    displayName: 'Deploy Frontend to Production'
    environment: 'lemotech-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            inputs:
              app_location: '/'
              api_location: ''
              output_location: '/'
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_FRONTEND)
            displayName: 'Deploy Frontend to Static Web App'

  - deployment: DeployAdmin
    displayName: 'Deploy Admin Dashboard to Production'
    environment: 'lemotech-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            inputs:
              app_location: '/'
              api_location: ''
              output_location: '/'
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN)
            displayName: 'Deploy Admin Dashboard to Static Web App'

# Azure Static Web Apps Deployment Template
# Supports: React, Vue, Angular, Static Sites

parameters:
  - name: staticWebAppToken
    type: string
  - name: appLocation
    type: string
    default: '/'
  - name: outputLocation
    type: string
    default: 'dist'
  - name: apiLocation
    type: string
    default: ''
  - name: environmentName
    type: string
    default: 'production'
  - name: customDomain
    type: string
    default: ''
  - name: skipAppBuild
    type: boolean
    default: true

steps:
  - script: |
      echo "=== Azure Static Web Apps Deployment ==="
      echo "Environment: ${{ parameters.environmentName }}"
      echo "App Location: ${{ parameters.appLocation }}"
      echo "Output Location: ${{ parameters.outputLocation }}"
      echo "API Location: ${{ parameters.apiLocation }}"
      echo "Skip Build: ${{ parameters.skipAppBuild }}"
      echo "Custom Domain: ${{ parameters.customDomain }}"
      
      # Verify build artifacts exist
      if [ ! -d "${{ parameters.outputLocation }}" ]; then
        echo "❌ Build output directory not found: ${{ parameters.outputLocation }}"
        exit 1
      fi
      
      echo "Build artifacts verified!"
    displayName: 'Pre-Deploy Verification'

  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: ${{ parameters.staticWebAppToken }}
      app_location: ${{ parameters.appLocation }}
      output_location: ${{ parameters.outputLocation }}
      api_location: ${{ parameters.apiLocation }}
      skip_app_build: ${{ parameters.skipAppBuild }}
    displayName: 'Deploy to Azure Static Web Apps'

  - script: |
      echo "=== Post-Deploy Health Check ==="
      
      # Wait for deployment to propagate
      echo "Waiting 30 seconds for deployment to propagate..."
      sleep 30
      
      # Try to get the deployment URL from Azure
      echo "Checking deployment status..."
      
      # Custom domain check if provided
      if [ "${{ parameters.customDomain }}" != "" ]; then
        SITE_URL="https://${{ parameters.customDomain }}"
        echo "Testing custom domain: $SITE_URL"
        
        for i in {1..5}; do
          echo "Health check attempt $i/5..."
          if curl -f -s -o /dev/null -w "%{http_code}" "$SITE_URL" | grep -q "200"; then
            echo "✅ Site is responding with HTTP 200!"
            echo "🌐 Site URL: $SITE_URL"
            break
          elif [ $i -eq 5 ]; then
            echo "⚠️ Custom domain not responding, but deployment may still be successful"
            echo "Please check the Azure portal for deployment status"
          else
            echo "Waiting 15 seconds before retry..."
            sleep 15
          fi
        done
      else
        echo "No custom domain specified, skipping URL health check"
        echo "Check Azure portal for the auto-generated URL"
      fi
      
      echo "✅ Azure Static Web Apps deployment completed!"
    displayName: 'Post-Deploy Health Check'
    condition: always()

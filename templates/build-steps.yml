jobs:
  - job: BuildAndTest
    pool:
      name: Default
    steps:
      - checkout: self
      
      - task: NodeTool@0
        inputs:
          versionSpec: $(NODE_VERSION)
        displayName: 'Install Node.js'
      
      - task: Cache@2
        inputs:
          key: $(CACHE_KEY)
          path: $(CACHE_PATHS)
          restoreKeys: |
            npm | $(Agent.OS)
            npm
        displayName: 'Cache npm packages'
      
      - bash: |
          set -e
          
          echo "Cleaning previous builds..."
          rm -rf node_modules dist .vite-temp node_modules/.vite-temp
          
          echo "Installing core dependencies..."
          npm install --save-dev vite@latest typescript@latest @vitejs/plugin-react@latest
          npm install react@18.2.0 react-dom@18.2.0 --save
          npm install --save-dev @types/react@18.2.0 @types/react-dom@18.2.0
          
          echo "Installing remaining dependencies..."
          export NODE_ENV=development
          npm ci
          
          echo "Building application..."
          export PATH="$PATH:./node_modules/.bin"
          npm run build
          
          if [ ! -d "dist" ]; then
            echo "##vso[task.logissue type=error]Build failed: dist directory not found"
            exit 1
          fi
          
          echo "Creating build info..."
          {
            echo "=== Build Information ==="
            echo "Build Number: $(Build.BuildNumber)"
            echo "Commit: $(Build.SourceVersion)"
            echo "Branch: $(Build.SourceBranch)"
            echo "Date: $(date)"
            echo
            echo "=== Environment ==="
            echo "Node Version: $(node -v)"
            echo "NPM Version: $(npm -v)"
            echo "Vite Version: $(./node_modules/.bin/vite --version || echo 'Not found')"
          } > "$(Build.ArtifactStagingDirectory)/build-info.txt"
          
          cp "$(Build.ArtifactStagingDirectory)/build-info.txt" "dist/"
        displayName: 'Build Application'
        workingDirectory: $(System.DefaultWorkingDirectory)
      
      - task: ArchiveFiles@2
        inputs:
          rootFolderOrFile: $(System.DefaultWorkingDirectory)/dist
          includeRootFolder: false
          archiveType: tar
          archiveFile: $(Build.ArtifactStagingDirectory)/site.tar.gz
          replaceExistingArchive: true
          verbose: true
        displayName: 'Archive build files'
      
      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)
          ArtifactName: drop
          publishLocation: Container
        displayName: 'Publish build artifacts' 